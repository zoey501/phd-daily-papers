<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhD Daily Papers</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#182033;--muted:#6c7689;--line:#e4e8f0;--accent:#405cf5;--soft:#eef1ff;--gold:#fff4cf}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:34px 20px 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{font-size:36px;margin:0 0 6px}.muted{color:var(--muted)}.views,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}.filters{margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:var(--text);color:#fff}.day{margin-top:30px}.day h2{font-size:18px;margin:0 0 12px;color:var(--muted)}.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 7px 24px rgba(26,36,58,.05)}.meta{font-size:14px;color:var(--muted)}.paper h3{font-size:24px;line-height:1.3;margin:7px 0 10px}.score{display:inline-block;background:#edf8ef;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.section{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.section b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}.section p,.section li{line-height:1.55}.actions{display:flex;gap:15px;flex-wrap:wrap;margin:17px 0 13px;padding:12px;background:#fafbfe;border-radius:12px}.actions label{font-weight:700;font-size:14px}.actions input{width:17px;height:17px;vertical-align:-3px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.paper a{color:var(--accent);font-weight:800;text-decoration:none}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);margin-top:25px}.saved{background:var(--gold)}@media(max-width:650px){.top h1{font-size:30px}.paper{padding:18px}.paper h3{font-size:20px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>🔬 PhD Daily Papers</h1><div class="muted">1–2 papers a day, summarized for your research.</div></div><div class="muted" id="todayLabel"></div></div>
<div class="views"><button class="btn active" data-view="today">Today</button><button class="btn" data-view="archive">Archive</button><button class="btn" data-view="publication">⭐ Useful for publication</button><button class="btn" data-view="unread">Unread</button></div>
<div class="filters"><button class="btn active" data-topic="all">All topics</button><button class="btn" data-topic="stress-granules">Stress granules</button><button class="btn" data-topic="ribosome">Ribosome</button><button class="btn" data-topic="translation">Translation</button><button class="btn" data-topic="ribosome-biogenesis">Ribosome biogenesis</button><button class="btn" data-topic="nuclear-speckles">Nuclear speckles</button><button class="btn" data-topic="drug">Drug mechanisms</button><button class="btn" data-topic="cryo-clem">Cryo-CLEM</button></div>
<div id="paperRoot"></div></div>
<script>
const NEW_PAPERS=[{"id":"pmid-41067892","date":"2026-09-14","journal":"Life Science Alliance · 2025 · Jayabalan, Bhambhani & Leung","title":"PARP10 is critical for stress granule initiation","score":"10/10","topics":["stress-granules","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/41067892/","q":"Which ADP-ribosyltransferase initiates mammalian stress-granule assembly, and does it act directly on the G3BP1 condensation machinery?","gap":"ADP-ribosylation has long been linked to stress granules, but the enzyme responsible for the early modification step and whether it controls granule nucleation kinetics rather than only later SG composition were unclear.","find":"A systematic knockdown of human ADP-ribosyltransferases identifies PARP10 as a major regulator of SG initiation. In U2OS cells, PARP10 depletion delays arsenite-induced G3BP1 granule assembly, reduces eIF2α phosphorylation, and changes SG composition, including loss of translation factors from isolated SGs. G3BP1 is ADP-ribosylated in a PARP10-dependent manner, and a synthetic G3BP1 mimic that bypasses part of its native condensation regulation is less dependent on PARP10. PARP10 depletion does not similarly block pateamine A-induced SGs, indicating that the requirement is stress/pathway dependent rather than a universal need for all SG assembly.","use":["This is highly relevant to your U2OS G3BP1-GFP system because the paper uses U2OS cells, endogenous/knock-in G3BP1 imaging, arsenite time courses and quantitative SG-positive-cell measurements.","Add PARP10 to the mechanistic layer of your non-canonical SG screen. If MIT-induced SGs are relatively PARP10-independent while arsenite SGs are PARP10-dependent, that would support distinct nucleation routes even when both generate G3BP1-positive condensates.","Useful markers and controls are G3BP1 together with eIF3b, phospho-eIF2α/total eIF2α, pan-ADP-ribose or mono-ADP-ribose reagents, PARP10 knockdown, and a pateamine A condition as an alternative translation-initiation/SG control.","The live-cell analysis is particularly transferable: quantify the fraction of cells entering the SG-positive state as a function of time, not only endpoint SG area. You can also compare lag time to first SG, number of granules and dissolution kinetics after washout.","The authors isolate SGs and examine their protein composition. For your work, a simpler first pass is IF-based partition coefficients for RPL7, RACK1 or eIF3b under PARP10 perturbation to ask whether ribosomal/translation-factor recruitment changes even when G3BP1 granules still form."],"idea":"In U2OS G3BP1-GFP cells, compare arsenite and MIT with control versus PARP10 knockdown. Acquire early live imaging at short intervals for the first 60 min and quantify time to first SG, SG-positive-cell fraction, SG number and SG area. In matched wells measure p-eIF2α and puromycin incorporation, and co-stain eIF3b or RPL7. Include pateamine A as a control predicted to be relatively PARP10-independent. A selective delay of arsenite SGs but not MIT SGs would provide strong evidence that MIT uses a mechanistically distinct SG-nucleation route."},{"id":"pmid-39351862","date":"2026-09-14","journal":"Nucleic Acids Research · 2024 · Chatterjee et al.","title":"Ribosome Quality Control mitigates the cytotoxicity of ribosome collisions induced by 5-Fluorouracil","score":"9.9/10","topics":["ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/39351862/","q":"Can an anticancer drug generate therapeutically relevant ribosome collisions, and does ribosome-associated quality control determine whether those collisions become cytotoxic?","gap":"5-Fluorouracil is classically explained through DNA metabolism and thymidylate synthase inhibition, although RNA incorporation contributes substantially to its anticancer activity. How RNA damage from 5FU affects translation, ribosome collisions and the RQC machinery—and whether cancer cells actively adapt to this translational stress—was poorly defined.","find":"5FU rapidly activates mTOR signaling, increases translation initiation and increases ribosome collisions. Collision/RQC engagement is detected by ZNF598-dependent mono-ubiquitination of eS10 and by MNase-resistant disome measurements. Loss of ZNF598 increases 5FU sensitivity and cell death. Suppressing mTOR with Torin-1 or translation initiation with 4EGI-1 reduces collisions and rescues the hypersensitivity of ZNF598-deficient cells. 5FU also increases ZNF598 and GIGYF2 protein abundance through an mTOR-dependent post-translational mechanism, indicating that cancer cells adaptively strengthen RQC while the drug simultaneously raises ribosome traffic.","use":["This is one of the closest pharmacological models to your project because it directly links an anticancer drug, altered translation, ribosome collisions, RQC and later cell death rather than treating translation inhibition as a single endpoint.","A practical collision marker is ubiquitinated eS10/RPS10 by Western blot. The study uses anisomycin as a positive control and ZNF598 knockout as a specificity control. For a stronger assay, MNase digestion followed by sucrose-gradient profiling gives a disome/monosome ratio.","Pair collision measurements with SUnSET/puromycin incorporation. Importantly, this paper shows that increased collisions can coexist with increased translation initiation, so collision burden should not be inferred simply from how strongly global protein synthesis falls.","mTOR is mechanistically informative rather than just a generic growth readout: p-S6 and p-4E-BP1 report the initiation-driving arm, while Torin-1 tests whether increased ribosome loading contributes to collisions. This is especially relevant to your interest in ISR/mTOR-independent versus dependent drug responses.","Useful RQC markers include ZNF598, GIGYF2, ubiquitinated eS10 and ASCC3. Cell-fate readouts include cleaved PARP, viability and long-term colony formation; in your live-cell system these can be replaced or complemented by Cytotox Red and single-cell survival tracking."],"idea":"Select MIT plus two library compounds with similar early puromycin suppression but different SG phenotypes. At 15–60 min measure p-S6/p-4E-BP1 and ubiquitinated eS10, then at later points measure ZNF598/GIGYF2 and cell death. Add Torin-1 to one arm. If Torin-1 reduces eS10 ubiquitination and later death without equivalently changing SG formation, that would separate collision-driven toxicity from SG assembly and help classify whether a compound's main ribosomal effect comes from increased ribosome traffic, elongation stress or both."}];
let PAPERS=[...NEW_PAPERS];
const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';
function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section class="day"><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}
function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><span class="score">Relevance: ${p.score}</span><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div><div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${p.use.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
async function loadArchive(){try{const sources=[['https://raw.githubusercontent.com/zoey501/phd-daily-papers/acdd755ab6b8976fd6848b1dea14f3719166c09e/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/e8246c10370642da882309143c142f34b2959a26/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/55c7542f8f1a8c14ffbabd5185e3600b35e21355/index.html','PAPERS']];let old=[];for(const [url,name] of sources){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('archive fetch failed');const t=await r.text();const re=new RegExp('const '+name+'=\\[([\\s\\S]*?)\\];');const m=t.match(re);if(!m)throw new Error('archive parse failed');old.push(...JSON.parse('['+m[1]+']'))}const ids=new Set(NEW_PAPERS.map(p=>p.id));const seen=new Set(ids);PAPERS=[...NEW_PAPERS,...old.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return true})]}catch(e){console.error(e)}render()}
render();loadArchive();
</script></body></html>
