<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhD Daily Papers</title>
<style>:root{--bg:#f6f8fc;--card:#fff;--text:#182033;--muted:#6c7689;--line:#e4e8f0;--accent:#405cf5;--soft:#eef1ff;--gold:#fff4cf}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:34px 20px 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{font-size:36px;margin:0 0 6px}.muted{color:var(--muted)}.views,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}.filters{margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:var(--text);color:#fff}.day{margin-top:30px}.day h2{font-size:18px;margin:0 0 12px;color:var(--muted)}.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 7px 24px rgba(26,36,58,.05)}.meta{font-size:14px;color:var(--muted)}.paper h3{font-size:24px;line-height:1.3;margin:7px 0 10px}.score{display:inline-block;background:#edf8ef;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.section{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.section b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}.section p,.section li{line-height:1.55}.actions{display:flex;gap:15px;flex-wrap:wrap;margin:17px 0 13px;padding:12px;background:#fafbfe;border-radius:12px}.actions label{font-weight:700;font-size:14px}.actions input{width:17px;height:17px;vertical-align:-3px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.paper a{color:var(--accent);font-weight:800;text-decoration:none}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);margin-top:25px}.saved{background:var(--gold)}@media(max-width:650px){.top h1{font-size:30px}.paper{padding:18px}.paper h3{font-size:20px}}</style></head>
<body><div class="wrap"><div class="top"><div><h1>🔬 PhD Daily Papers</h1><div class="muted">1–2 papers a day, summarized for your research.</div></div><div class="muted" id="todayLabel"></div></div><div class="views"><button class="btn active" data-view="today">Today</button><button class="btn" data-view="archive">Archive</button><button class="btn" data-view="publication">⭐ Useful for publication</button><button class="btn" data-view="unread">Unread</button></div><div class="filters"><button class="btn active" data-topic="all">All topics</button><button class="btn" data-topic="stress-granules">Stress granules</button><button class="btn" data-topic="ribosome">Ribosome</button><button class="btn" data-topic="translation">Translation</button><button class="btn" data-topic="ribosome-biogenesis">Ribosome biogenesis</button><button class="btn" data-topic="nuclear-speckles">Nuclear speckles</button><button class="btn" data-topic="drug">Drug mechanisms</button><button class="btn" data-topic="cryo-clem">Cryo-CLEM</button></div><div id="paperRoot"></div></div>
<script>
const NEW_PAPERS=[
{"id":"pmid-42214329","date":"2026-09-16","journal":"Molecular Cell · 2026 · Vind et al.","title":"Mechanism of RACK1-dependent ZAKα activation at stalled and collided ribosomes","score":"10/10","topics":["ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/42214329/","q":"What physical feature of translation-impaired ribosomes is sensed by ZAKα, and how can the same kinase respond to both single stalled ribosomes and ribosome collisions?","gap":"ZAKα is a central sensor of the ribotoxic stress response, but the molecular signal that converts diverse translation defects into ZAKα activation was unclear. In particular, it was unresolved whether collisions are strictly required or whether loss of ribosome processivity itself can be sufficient.","find":"The authors combine AlphaFold3, ZAKα iCLIP, ribosome profiling, biochemical ribosome binding and perturbations in human cells to show that ZAKα dynamically monitors the mRNA exit channel through contacts with RACK1, RPS27, 18S rRNA helix 26 and the exiting mRNA. Normal elongation rapidly displaces ZAKα, whereas mRNA stasis stabilizes its residence and permits activation. A single stalled ribosome can activate ZAKα in U2OS cells, while collisions amplify signaling by bringing ZAKα molecules into proximity and favoring dimerization/trans-autophosphorylation. RACK1 is therefore a critical hub linking impaired ribosome processivity to p38/JNK ribotoxic-stress signaling.","use":["This is highly relevant to your drug screen because it warns against equating ZAKα activation with ribosome collision: in U2OS, a single stalled 80S can activate the RSR even when disomes are absent.","Use low versus high anisomycin as mechanistically informative controls: low-dose anisomycin produces widespread collisions, whereas high-dose anisomycin freezes ribosomes and largely removes collision peaks while still allowing ZAKα-dependent signaling.","Useful readouts include phospho-p38 and phospho-JNK downstream of ZAKα, alongside translation/SUnSET and a collision-specific assay such as MNase-resistant disomes or ubiquitinated RPS10/eS10. This combination can separate stalling from collision.","Harringtonine and lactimidomycin provide single-ribosome-stalling controls. The study also shows strong cell-line dependence, so U2OS-specific validation is important rather than assuming RSR behavior from HEK293T or HAP1.","For deeper follow-up, ZAKα iCLIP and ribosome profiling can map where a candidate drug reduces ribosome processivity, but a first-pass western blot panel of p-p38/p-JNK plus collision markers is much more scalable for your 55-hit drug set."],"idea":"Build a small mechanistic matrix in U2OS for MIT, arsenite and 3–5 selected ribosome-targeting SG inducers. Measure SG formation, puromycin incorporation, p-p38/p-JNK and Ub-eS10/RPS10 at matched early time points, with low- and high-dose anisomycin as collision-versus-stalling controls. Drugs with strong ZAKα signaling but weak Ub-eS10 would be candidates for primarily stalled/processivity-impaired ribosomes; drugs positive for both would be stronger collision/RQC candidates. Then ask whether RPL7 enrichment in SGs tracks either class."},
{"id":"pmid-41583565","date":"2026-09-16","journal":"iScience · 2025/2026 · Adachi et al.","title":"Chronic stress antagonizes formation of stress granules","score":"10/10","topics":["stress-granules","ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41583565/","q":"Why can chronically stressed cells fail to form stress granules after a new acute stress even when protein synthesis is strongly inhibited?","gap":"Most SG models assume that translation-initiation inhibition followed by polysome runoff liberates mRNA for condensation, but SG behavior after prolonged stress was poorly characterized. It was unclear whether low translation is itself sufficient for SG assembly when elongation and ribosome occupancy have already been remodeled by chronic stress.","find":"In U2OS cells, 24-hour low-dose stresses including arsenite and several mechanistically distinct stresses suppress subsequent acute-stress SG formation despite strong protein-synthesis inhibition. Polysome profiling shows incomplete polysome disassembly. Chronic stress slows translation elongation, increases eEF2 phosphorylation and produces ribosome stalling that retains mRNAs in polysomes. Harringtonine runoff confirms slower elongation. Importantly, the authors distinguish this stalling from canonical collision/RQC behavior and show that puromycin alone is not sufficient to fully restore SG formation after chronic preconditioning.","use":["This directly fits your long MIT Incucyte time course: the relationship between translation inhibition and SG formation can change over hours, so late SG loss does not necessarily mean translation has recovered.","Add phospho-eEF2/total eEF2 to your p-eIF2α and puromycin panel. It provides a practical marker for elongation slowdown that is mechanistically different from initiation inhibition.","The paper uses U2OS and G3BP1/eIF4G/eIF3b immunofluorescence plus oligo(dT) FISH, giving you a strong orthogonal test that a G3BP1 punctum contains untranslated poly(A) RNA rather than being only a protein aggregate.","Harringtonine runoff/polysome profiling is a strong way to distinguish slow elongation from simple global translation inhibition. Anisomycin is used as a ribosome-freezing control, and puromycin tests whether ribosome release can rescue mRNA availability.","A useful analysis principle is to compare identical acute challenges after different pre-exposure durations (0, 1, 4, 12, 24 h). This could reveal when MIT-treated cells transition from SG-competent to SG-refractory states."],"idea":"Use your MIT10/MIT20 time-course logic in a fixed-cell experiment: pre-treat U2OS with MIT for 0, 4, 8 and 12 h, then apply a short arsenite challenge. Quantify G3BP1 SG-positive fraction, SG area/number, p-eIF2α, p-eEF2 and puromycin incorporation. If later MIT-pretreated cells remain translation-suppressed but become refractory to arsenite-induced SGs while p-eEF2 rises, it would support a time-dependent elongation-stalling mechanism for the SG disappearance you observe in live imaging."}
];
let PAPERS=[...NEW_PAPERS];const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[m]))}
function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section class="day"><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}
function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><span class="score">Relevance: ${p.score}</span><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div><div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${p.use.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
async function loadArchive(){try{const sources=[['https://raw.githubusercontent.com/zoey501/phd-daily-papers/0822859918f8a2e673bf6232dc57c6d1eac0a481/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/6055d71efcc39fdf5d4b8a1e637fe83e10f0a132/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/7a8db5429be6351fd01f32b9d75fe2141341b1d1/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/70256912e0c2dc35d6539e42aea115f7e282d9c6/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/acdd755ab6b8976fd6848b1dea14f3719166c09e/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/e8246c10370642da882309143c142f34b2959a26/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/55c7542f8f1a8c14ffbabd5185e3600b35e21355/index.html','PAPERS']];let old=[];for(const [url,name] of sources){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('archive fetch failed');const t=await r.text();const re=new RegExp('const '+name+'=\\[([\\s\\S]*?)\\];');const m=t.match(re);if(!m)throw new Error('archive parse failed');old.push(...JSON.parse('['+m[1]+']'))}const seen=new Set(NEW_PAPERS.map(p=>p.id));PAPERS=[...NEW_PAPERS,...old.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return true})]}catch(e){console.error(e)}render()}render();loadArchive();
</script></body></html>
