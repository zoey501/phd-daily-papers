<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhD Daily Papers</title><style>:root{--bg:#f6f8fc;--card:#fff;--text:#182033;--muted:#6c7689;--line:#e4e8f0;--accent:#405cf5;--soft:#eef1ff;--gold:#fff4cf}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:34px 20px 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{font-size:36px;margin:0 0 6px}.muted{color:var(--muted)}.views,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}.filters{margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:var(--text);color:#fff}.day{margin-top:30px}.day h2{font-size:18px;margin:0 0 12px;color:var(--muted)}.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 7px 24px rgba(26,36,58,.05)}.meta{font-size:14px;color:var(--muted)}.paper h3{font-size:24px;line-height:1.3;margin:7px 0 10px}.score{display:inline-block;background:#edf8ef;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.section{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.section b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}.section p,.section li{line-height:1.55}.actions{display:flex;gap:15px;flex-wrap:wrap;margin:17px 0 13px;padding:12px;background:#fafbfe;border-radius:12px}.actions label{font-weight:700;font-size:14px}.actions input{width:17px;height:17px;vertical-align:-3px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.paper a{color:var(--accent);font-weight:800;text-decoration:none}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);margin-top:25px}.saved{background:var(--gold)}@media(max-width:650px){.top h1{font-size:30px}.paper{padding:18px}.paper h3{font-size:20px}}</style></head><body><div class="wrap"><div class="top"><div><h1>🔬 PhD Daily Papers</h1><div class="muted">1–2 papers a day, summarized for your research.</div></div><div class="muted" id="todayLabel"></div></div><div class="views"><button class="btn active" data-view="today">Today</button><button class="btn" data-view="archive">Archive</button><button class="btn" data-view="publication">⭐ Useful for publication</button><button class="btn" data-view="unread">Unread</button></div><div class="filters"><button class="btn active" data-topic="all">All topics</button><button class="btn" data-topic="stress-granules">Stress granules</button><button class="btn" data-topic="ribosome">Ribosome</button><button class="btn" data-topic="translation">Translation</button><button class="btn" data-topic="ribosome-biogenesis">Ribosome biogenesis</button><button class="btn" data-topic="nuclear-speckles">Nuclear speckles</button><button class="btn" data-topic="drug">Drug mechanisms</button><button class="btn" data-topic="cryo-clem">Cryo-CLEM</button></div><div id="paperRoot"></div></div><script>
const NEW_PAPERS=[
{"id":"pmid-41451945","date":"2026-09-20","journal":"FEBS Journal · 2026 · Huang et al.","title":"Crosstalk between the ribosome quality control-associated E3 ubiquitin ligases LTN1 and RNF10","score":"9.5/10","topics":["ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41451945/","q":"How do the RQC E3 ligases LTN1 and RNF10 cooperate or compensate during stalled-translation quality control?","gap":"LTN1 is the canonical ligase for nascent-chain ubiquitination on 60S subunits, but how additional E3 ligases integrate with LTN1 to determine the fate of stalled products remained unclear.","find":"The study identifies functional crosstalk between LTN1 and RNF10 during ribosome-associated quality control. RNF10 contributes to quality control of aberrant translation products and can influence the cellular response when LTN1 activity is limiting, supporting a distributed E3 network rather than a single-ligase pathway. The work combines genetic perturbation, biochemical analysis of ubiquitinated products and cell-based stress assays.","use":["Use this paper to expand your collision/RQC panel beyond ZNF598 and LTN1. A drug can generate collisions normally but produce a different phenotype if downstream nascent-chain ubiquitination or disposal is buffered by RNF10.","Candidate readouts for your U2OS library are RNF10 and LTN1 abundance/localization, ubiquitinated nascent-chain signal, insoluble ubiquitin, RQC-dependent viability and recovery after washout.","Pair the E3 readouts with RPL7 and G3BP1 IF so that ribosome-enriched SGs can be compared with unresolved RQC substrates rather than being treated as the same phenomenon.","Use anisomycin or harringtonine as mechanistic controls, plus puromycin as a ribosome-release control. Include MG132 or proteasome inhibition only as a secondary accumulation control because it can itself alter SG dynamics."],"idea":"In U2OS, compare MIT, anisomycin and arsenite ± RNF10 or LTN1 depletion. Quantify G3BP1-positive SG number/area, RPL7 partition coefficient, Ub-eS10 or ubiquitinated nascent-chain signal, and post-washout viability. Prediction: a drug that leaves SGs but causes persistent RQC substrate accumulation will show high RPL7/SG enrichment together with elevated ubiquitin and poor recovery; RNF10 versus LTN1 depletion should separate initiation of ribosome-collision handling from final nascent-chain disposal."},
{"id":"pmid-41928510","date":"2026-09-20","journal":"Molecular Cell · 2026 · Zhao et al.","title":"2'-O-Methylation maintains ribosome structural and translation integrity","score":"9/10","topics":["ribosome","translation","ribosome-biogenesis"],"url":"https://pubmed.ncbi.nlm.nih.gov/41928510/","q":"How does ribosomal RNA 2'-O-methylation preserve mature ribosome structure and translational fidelity?","gap":"Ribosome biogenesis studies often score abundance or localization of ribosomal proteins, but the functional consequences of site-specific rRNA modification loss for ribosome integrity and translation are less directly connected to stress phenotypes.","find":"The study shows that 2'-O-methylation is required for structural and functional integrity of the ribosome. Perturbing the modification machinery compromises ribosome architecture and translation, linking rRNA modification state to the quality of mature ribosomes rather than only to assembly timing. The work combines structural/biochemical analyses with translation and cell-based assays.","use":["This gives you a useful explanation for why two compounds can produce similar global puromycin suppression but different SG morphology: they may perturb ribosome quality or decoding capacity rather than simply inhibit initiation.","For selected hits, consider adding RPS6/RPL7 IF, polysome profiles or disome-sensitive readouts, and a ribosome-integrity assay if the lab has access to sucrose gradients or rRNA-quality measurements.","In a ribosome-biogenesis follow-up, combine NPM1/B23, fibrillarin and pre-rRNA markers with translation output so nucleolar changes are not interpreted only from morphology.","A practical control set is cycloheximide to stabilize polysomes, puromycin to release translating ribosomes, and anisomycin/harringtonine to separate elongation or initiation effects from ribosome-quality defects."],"idea":"Select one ribosome-targeting hit and compare it with anisomycin in U2OS using G3BP1, RPL7 and NPM1 immunofluorescence plus SUnSET, 40S/60S marker ratios and recovery after washout. If the hit causes disproportionate RPL7 enrichment, abnormal SG persistence and delayed translation recovery despite similar initial SUnSET suppression, test whether the phenotype is consistent with compromised ribosome structural integrity rather than simple initiation blockade."},
{"id":"pmid-42524886","date":"2026-09-19","journal":"Journal of Cell Biology · 2026 · Tereshchenko et al.","title":"PARP1 hyperactivity stalls translation and triggers stress granule formation following DNA damage","score":"10/10","topics":["stress-granules","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/42524886/","q":"How is a nuclear DNA-damage signal transmitted to the cytoplasm to inhibit translation and trigger stress-granule assembly?","gap":"Genotoxic drugs can induce stress granules, but the signaling chain connecting nuclear DNA damage to cytoplasmic translational shutdown was unclear.","find":"DNA-damaging agents activate PARP1, causing NAD+ depletion and a secondary fall in ATP. AMPK activation inhibits mTORC1 and drives 4E-BP1 hypophosphorylation, enabling G3BP-dependent SG formation. NAD+ precursor supplementation reverses this response, and G3BP1/2 deficiency reduces survival after genotoxic stress.","use":["Useful comparator for MIT because MIT is a DNA-damaging anticancer drug yet your MIT SGs are ribosome-enriched and mTOR-independent.","Measure PARP1/PAR, ATP/NAD+ if feasible, p-AMPK, p-Raptor, p-S6 or p-4E-BP1 and nascent translation.","Use NAD+ rescue and PARP inhibition as causal controls alongside puromycin/SUnSET and cycloheximide."],"idea":"Compare MIT with MMS ± PARP inhibitor or NAD+ precursor while measuring G3BP1 SGs, RPL7 partition coefficient, puromycin incorporation, p-AMPK and 4E-BP1. A selective rescue of MMS but not MIT would support distinct SG mechanisms."}
];
let PAPERS=[...NEW_PAPERS];const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section class="day"><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><span class="score">Relevance: ${p.score}</span><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div><div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${p.use.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});async function loadArchive(){try{const sources=['https://raw.githubusercontent.com/zoey501/phd-daily-papers/23c2022bbc04edbd3fcdf66a4cf415d6bf1d8a1e/index.html','https://raw.githubusercontent.com/zoey501/phd-daily-papers/5a95f894eaf7ca9da605b6dd374eacb3a91326c9/index.html','https://raw.githubusercontent.com/zoey501/phd-daily-papers/0822859918f8a2e673bf6232dc57c6d1eac0a481/index.html','https://raw.githubusercontent.com/zoey501/phd-daily-papers/6055d71efcc39fdf5d4b8a1e637fe83e10f0a132/index.html','https://raw.githubusercontent.com/zoey501/phd-daily-papers/7a8db5429be6351fd01f32b9d75fe2141341b1d1/index.html','https://raw.githubusercontent.com/zoey501/phd-daily-papers/70256912e0c2dc35d6539e42aea115f7e282d9c6/index.html','https://raw.githubusercontent.com/zoey501/phd-daily-papers/acdd755ab6b8976fd6848b1dea14f3719166c09e/index.html','https://raw.githubusercontent.com/zoey501/phd-daily-papers/e8246c10370642da882309143c142f34b2959a26/index.html','https://raw.githubusercontent.com/zoey501/phd-daily-papers/55c7542f8f1a8c14ffbabd5185e3600b35e21355/index.html'];let old=[];for(const url of sources){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('archive fetch failed');const t=await r.text();for(const name of ['NEW_PAPERS','PAPERS']){const re=new RegExp('const '+name+'=\\[([\\s\\S]*?)\\];');const m=t.match(re);if(m)old.push(...JSON.parse('['+m[1]+']'))}}const seen=new Set(NEW_PAPERS.map(p=>p.id));PAPERS=[...NEW_PAPERS,...old.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return true})]}catch(e){console.error(e)}render()}render();loadArchive();</script></body></html>
