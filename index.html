:root{--bg:#f6f8fc;--card:#fff;--text:#182033;--muted:#6c7689;--line:#e4e8f0;--accent:#405cf5;--soft:#eef1ff;--gold:#fff4cf}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:34px 20px 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{font-size:36px;margin:0 0 6px}.muted{color:var(--muted)}.views,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}.filters{margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:var(--text);color:#fff}.day{margin-top:30px}.day h2{font-size:18px;margin:0 0 12px;color:var(--muted)}.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 7px 24px rgba(26,36,58,.05)}.meta{font-size:14px;color:var(--muted)}.paper h3{font-size:24px;line-height:1.3;margin:7px 0 10px}.score{display:inline-block;background:#edf8ef;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.section{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.section b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}.section p,.section li{line-height:1.55}.actions{display:flex;gap:15px;flex-wrap:wrap;margin:17px 0 13px;padding:12px;background:#fafbfe;border-radius:12px}.actions label{font-weight:700;font-size:14px}.actions input{width:17px;height:17px;vertical-align:-3px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.paper a{color:var(--accent);font-weight:800;text-decoration:none}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);margin-top:25px}.saved{background:var(--gold)}@media(max-width:650px){.top h1{font-size:30px}.paper{padding:18px}.paper h3{font-size:20px}}

<body><div class="wrap">

<script>
const NEW_PAPERS=[
{"id":"pmid-39760726","date":"2026-09-12","journal":"Journal of Cell Biology · 2025 · Challa et al.","title":"RACK1 MARylation regulates translation and stress granules in ovarian cancer cells","score":"10/10","topics":["stress-granules","ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/39760726/","q":"Does post-translational modification of a ribosomal protein directly coordinate translation control, stress-granule assembly and cancer-cell growth?","gap":"RACK1 is an integral 40S ribosomal protein and mono-ADP-ribosylation is known to regulate stress responses, but it was unclear whether modification of a ribosomal component could act as a switch coupling polysome remodeling to SG assembly and whether that mechanism could be therapeutically targeted in cancer.","find":"The study shows that PARP14 mono-ADP-ribosylates RACK1 at defined sites in ovarian cancer cells. RACK1 MARylation promotes its colocalization with G3BP1, eIF3η and 40S ribosomal proteins in stress granules and is associated with selective translational repression, including reduced translation of cancer-relevant transcripts such as AKT. PARP14 inhibition or mutation of the RACK1 MARylation sites suppresses these effects and reduces ovarian-cancer growth in culture and in vivo. During recovery, TARG1 removes MAR from RACK1, SGs dissolve and translation is restored, defining a reversible ribosome-to-SG regulatory cycle.","use":["This is unusually close to your project because it connects a ribosomal protein, translation remodeling, SG composition and an anticancer mechanism in one pathway rather than treating SGs only as downstream markers of translation inhibition.","Useful IF markers are G3BP1 together with RACK1 and eIF3η, plus selected 40S proteins. You could quantify RACK1 SG/cytoplasm partition coefficients in the same way you currently quantify RPL7 enrichment.","PARP14 inhibition provides a perturbation that separates SG formation from the upstream stress itself. RACK1 MARylation-site mutants are an even cleaner mechanistic control if you later move beyond pharmacology.","Pair SG imaging with puromycin incorporation or another nascent-protein-synthesis assay and, where feasible, polysome profiling. This lets you ask whether a drug changes SG assembly and translation in parallel or uncouples the two processes.","The recovery arm is especially useful for your live-cell work: quantify the kinetics of G3BP1 granule dissolution together with restoration of translation, and test whether ribosomal proteins leave SGs with the same kinetics as G3BP1."],"idea":"For MIT, arsenite and one SG-inducing library hit, perform a 1 h treatment followed by washout and collect 0, 30, 60 and 120 min recovery points. Co-stain G3BP1 with RACK1 and RPL7, and measure SG partition coefficients for both ribosomal proteins while measuring global translation in matched wells by puromycin incorporation. Add a PARP14 inhibitor condition. If PARP14 inhibition selectively reduces RACK1 recruitment or accelerates SG dissolution without producing the same effect on RPL7, it would suggest that different ribosome-associated components enter your drug-induced SGs through mechanistically distinct routes."},
{"id":"pmid-41475347","date":"2026-09-12","journal":"Molecular Cell · 2026 · Khan et al.","title":"Mechanical forces regulate the composition and fate of stalled nascent chains","score":"9.6/10","topics":["ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/41475347/","q":"After collided ribosomes are split, how does the RQC machinery physically expose, ubiquitinate, release and degrade the nascent chain that remains attached to the large ribosomal subunit?","gap":"RQC CAT tailing was known to extend stalled nascent chains, but why CAT-tail composition changes and how CAT tailing coordinates with Ltn1-mediated ubiquitination and Cdc48-driven extraction were unresolved. This left an important mechanistic gap between ribosome collision/splitting and final disposal of the aberrant protein product.","find":"Using defined stalled substrates in yeast, the authors show that mechanical force on the nascent chain switches RQC between two functional modes. Before efficient ubiquitination, Rqc2-dependent CAT tailing operates in an extrusion mode that pushes the nascent chain farther from the 60S exit tunnel and increases lysine accessibility to Ltn1. Threonine in CAT tails prevents polyalanine helices that would hinder extrusion. After ubiquitination, Cdc48 pulling changes CAT tailing toward an alanine-rich release mode that promotes nascent-chain release and degradation. Failure to make this transition leaves nascent chains on large ribosomal subunits and promotes proteotoxic aggregation.","use":["For your ribosome-collision project, this emphasizes that detecting collisions or ZNF598 activation is only the beginning of RQC. Downstream failure at nascent-chain extraction can create a very different proteotoxic state even when collision sensing is intact.","The paper uses GFP-based stall reporters with polyarginine stall sequences, immunoblot mobility shifts to monitor CAT tails, insoluble-aggregate measurements and fluorescence microscopy of inclusions. A mammalian homologous strategy could use a defined stalling reporter together with NEMF/LTN1/VCP perturbations.","Conceptually separate three stages in drug experiments: collision recognition/splitting, nascent-chain ubiquitination and extraction/degradation. Useful mammalian markers include ZNF598 and ubiquitinated uS10/eS10 upstream, then NEMF, LTN1 and VCP/p97 downstream.","Include proteasome or VCP inhibition as positive controls for defective disposal of RQC products. This can reveal whether a ribosome-targeting drug primarily increases collision generation or instead overloads the downstream clearance machinery.","Because failed RQC generates aggregation-prone products, combine translation measurements with an insoluble-protein or ubiquitin-aggregate readout rather than assuming that stronger translation shutdown always means less proteotoxic stress."],"idea":"Choose one SG-positive ribosome-targeting drug and one SG-negative translation inhibitor at concentrations giving similar global translation suppression. At early time points measure uS10/eS10 ubiquitination and ZNF598 as collision-sensing readouts; at later points measure NEMF/LTN1/VCP association and detergent-insoluble ubiquitinated proteins. Add a VCP inhibitor as a downstream-RQC failure control. If the two drugs have similar early collision signals but differ strongly in insoluble RQC products and SG persistence, that would help place their mechanistic divergence downstream of collision sensing rather than at the level of ISR activation."},
{"id":"pmid-42174134","date":"2026-09-11","journal":"Nature Cell Biology · 2026 · Ge et al.","title":"Stress granules restrain ferroptosis by sequestering ferritin","score":"10/10","topics":["stress-granules","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/42174134/","q":"Do stress granules actively determine cancer-cell fate after therapy, and if so, what SG cargo provides protection against ferroptotic cell death?","gap":"Stress granules are often associated with stress tolerance, but direct mechanisms linking an SG-resident cargo to a defined cell-death pathway and treatment resistance were limited. It was unclear whether SGs merely correlate with survival or physically re-route a death-relevant metabolite or protein pool.","find":"In glioblastoma stem cells exposed to irradiation or temozolomide, disrupting SG formation increases ferroptotic death. SG proteomics identified ferritin as a recruited cargo. G3BP1 directly binds ferritin light chain (FTL), and therapy-induced oxidation of G3BP1 methionine 333 promotes this interaction. Sequestration of ferritin in SGs limits the labile Fe2+ pool and suppresses ferritinophagy, thereby restraining lipid peroxidation and ferroptosis. Genetic G3BP1/2 loss or pharmacological disruption of the G3BP1-FTL interaction restores ferroptosis and sensitizes tumors to treatment.","use":["This is directly relevant to your live-cell question of whether SG-positive cells survive longer than SG-negative cells. It provides a concrete mechanism by which an SG can be protective rather than simply a marker of a less-damaged cell.","Useful imaging markers are G3BP1 plus FTL/ferritin, with eIF3η as an orthogonal SG marker. Quantify FTL partitioning into SGs rather than only SG number or area.","For cell-fate validation, the study uses C11-BODIPY for lipid peroxidation and iron-sensitive probes including FerroOrange, Lyso-FerroRed and Mito-FerroGreen. Ferrostatin-1 or liproxstatin-1 and the iron chelator DFO provide strong rescue controls for ferroptosis.","G3BP1/2 double knockout and G3BP1 domain/mutant re-expression separate the effect of granule formation from the specific G3BP1-FTL interaction. Ferritinophagy/autophagy controls include ATG5 perturbation and chloroquine.","Importantly for your U2OS system, the paper also tested G3BP1/2-dependent labile-iron phenotypes in U2OS cells, making the mechanism worth checking outside glioblastoma cells."],"idea":"In your MIT versus arsenite live-cell experiment, classify tracked U2OS cells as early SG-positive or SG-negative, then at matched time points measure ferritin/FTL localization and lipid peroxidation. A practical first version is G3BP1 plus FTL IF at 1–4 h and C11-BODIPY or FerroOrange at a later pre-death time point. Add ferrostatin-1 as a rescue control. If SG-positive cells show stronger FTL partitioning into SGs, lower lipid peroxidation and longer survival, it would give a mechanistic explanation for the survival advantage you have observed rather than only a correlation."},
{"id":"pmid-41876741","date":"2026-09-11","journal":"The EMBO Journal · 2026 · Schichler et al.","title":"Ki-67 shapes the nucleolus by anchoring chromatin via its amphiphilic properties","score":"9.7/10","topics":["ribosome","ribosome-biogenesis"],"url":"https://pubmed.ncbi.nlm.nih.gov/41876741/","q":"What physically determines the irregular shape of interphase nucleoli, and can nucleolar morphology change independently of a primary defect in rRNA transcription or processing?","gap":"NPM1/B23 shape, size and number are widely used as nucleolar-stress readouts, but similar rounded morphologies can arise from very different mechanisms. The contribution of surrounding chromatin to nucleolar shape had not been systematically separated from direct ribosome-biogenesis defects.","find":"A high-throughput imaging RNAi screen identified Ki-67 as a central regulator of nucleolar shape. Ki-67 sits at the chromatin-nucleolus interface and anchors heterochromatin at the nucleolar rim and in internal invaginations. Ki-67 depletion rounds nucleoli and removes these chromatin contacts with little effect on nucleolar size or number, and acute chromatin digestion phenocopies the rounding. The phenotype is also seen in U2-OS cells. Unlike depletion of many SSU-processome factors, which produces nucleolar caps through impaired ribosome biogenesis, Ki-67 loss changes morphology through a chromatin-anchoring mechanism and is largely dispensable for efficient rDNA transcription and pre-rRNA processing.","use":["For your B23/NPM1 drug screen, a rounded nucleolus should not automatically be interpreted as inhibited ribosome biogenesis. Add chromatin organization as an orthogonal readout when a compound changes NPM1 morphology.","The paper uses NPM1-EGFP together with H2B-mCherry or DNA dyes and quantifies nucleolar circularity/aspect ratio. This is easy to translate into your CellProfiler workflow.","A particularly useful analysis is to expand and shrink the NPM1 nucleolar mask to define rim versus interior, then measure DNA or Ki-67 intensity in those compartments. They also use radial/concentric-ring intensity profiles around intranucleolar chromatin foci.","Markers that distinguish mechanisms include Ki-67 and heterochromatin markers HP1α/HP1β, H3K9me3 and H4K20me3, alongside NPM1. UBF and fibrillarin help determine whether canonical nucleolar subcompartments are reorganized.","Use a Pol I/ribosome-biogenesis perturbation as a positive control for nucleolar caps and Ki-67 depletion as a contrasting control for chromatin-driven rounding. This can separate direct ribosome-biogenesis defects from shape changes caused by altered chromatin anchoring."],"idea":"Choose two compounds from your B23/NPM1 screen that produce similarly rounded nucleoli. Co-stain NPM1, Ki-67 and DNA or H3K9me3, and quantify circularity, nucleolar rim/interior chromatin intensity and Ki-67 partitioning. In parallel measure a pre-rRNA readout. If one drug causes rounding plus loss of Ki-67/chromatin at the nucleolar boundary without a strong pre-rRNA defect, while the other produces caps and reduced pre-rRNA, you would have two visually similar but mechanistically distinct classes of nucleolar drug response."},
{"id":"pmid-41535071","date":"2026-09-10","journal":"Genes & Development · 2026 · Baymiller et al.","title":"tRNA synthetase activity is required for stress granule and P-body assembly","score":"10/10","topics":["stress-granules","ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41535071/","q":"When translation elongation is impaired, why can the integrated stress response be strongly activated without stress-granule formation, and which stalled-ribosome states permit or prevent RNP-granule assembly?","gap":"Canonical models link eIF2α phosphorylation and translation inhibition to stress-granule formation, yet many translation-targeting perturbations activate the ISR without producing SGs. It was unclear whether the missing step is ribosome runoff, ribosome-collision clearance or another granule-specific signaling event.","find":"Blocking tRNA aminoacylation with tRNA-synthetase inhibitors produces robust ISR activation and global translation suppression but fails to induce stress granules or P-bodies. The reason is persistent ribosome occupancy on mRNAs: collided ribosomes are cleared relatively rapidly by ZNF598-dependent RQC, whereas largely uncollided stalled ribosomes persist for more than 16 h and remain resistant to normal rescue. Puromycin releases these persistent stalls and restores RNP-granule assembly. The phenotype generalizes across multiple tRNA-synthetase inhibitors and amino-acid deprivation, showing that SG formation reports not simply translation inhibition or eIF2α phosphorylation but whether mRNAs have actually been cleared of elongating/stalled ribosomes.","use":["This paper directly matches your observation that several ribosome-targeting or antibiotic-like compounds phosphorylate eIF2α but do not form G3BP1-positive SGs. It provides a mechanistic explanation: those conditions may trap mRNAs in stalled polysomes instead of generating ribosome-free mRNA available for SG condensation.","The most useful control is puromycin rescue. If a drug is SG-negative because persistent ribosomes remain on mRNA, a short puromycin treatment should release them and may permit G3BP1 granule formation; failure to rescue would suggest a different block in SG assembly.","Pair p-eIF2α with a direct translation readout such as puromycin/SUnSET or AHA incorporation and a ribosome-occupancy readout such as polysome profiling. This separates ISR activation, protein-synthesis inhibition and ribosome runoff instead of treating them as one pathway.","Useful mechanistic markers/perturbations include ZNF598, ubiquitinated uS10/eS10, G3BP1, DCP1A for P-bodies, harringtonine runoff, puromycin, halofuginone and amino-acid deprivation. A ZNF598 knockdown or overexpression control can help determine whether collision-dependent RQC contributes to the drug response.","For imaging analysis, quantify SG-positive fraction, SG number and SG area together with polysome retention at matched time points. A time course is important because collided ribosomes can be resolved within hours while uncollided stalls can persist much longer."],"idea":"Take two compounds from your 60-drug screen that strongly increase p-eIF2α but remain SG-negative, plus arsenite as an SG-positive control. Measure p-eIF2α and global translation at 1 h and 4 h, then add a short puromycin pulse before fixation. Quantify G3BP1 SG formation with and without puromycin and, in parallel, measure polysome retention or RNase-resistant collision products. If puromycin converts an SG-negative drug into an SG-positive condition, that would strongly support persistent ribosome occupancy as the missing step between ISR activation and SG assembly in your screen."},
{"id":"pmid-40750700","date":"2026-09-09","journal":"The EMBO Journal · 2025 · De La Cruz et al.","title":"Single-protein/RNA imaging reveals ZNF598 as a limiting factor in resolving collided ribosomes","score":"10/10","topics":["ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/40750700/","q":"How does ZNF598 engage individual collided-ribosome queues in living cells, and is ZNF598 availability itself a rate-limiting step in mammalian ribosome-associated quality control?","gap":"ZNF598 was established as a collision sensor that ubiquitinates 40S proteins, but bulk biochemical approaches could not directly show its binding dynamics on individual translating mRNAs, whether several ZNF598 molecules engage one queue, or which RQC step limits ribosome clearance in cells.","find":"The authors combined endogenous ZNF598-HaloTag with a single-mRNA translation reporter in U-2 OS cells to visualize ZNF598 recruitment and translation simultaneously. Multiple ZNF598 molecules can engage a single poly(A)-stall reporter, and ZNF598 overexpression accelerates ribosome runoff by about 1.5-fold, supporting ZNF598 as a limiting factor for collision clearance. A minority of apparently normal messages are also ZNF598-positive and unusually resistant to harringtonine runoff. Under widespread UV-induced RNA damage, ZNF598 recruitment to the strong RQC reporter falls, consistent with a limited cellular ZNF598 pool becoming saturated.","use":["This is directly relevant to your ribosome-collision/RQC question because it shows that the amount of ZNF598 available can determine how efficiently collisions are cleared, so equal collision burden does not necessarily produce equal downstream outcomes.","The study uses U-2 OS cells, making its behavior especially transferable to your U2OS-based drug experiments.","Useful tools include endogenous ZNF598-HaloTag, the SINAPS single-mRNA nascent-peptide reporter, a poly(A)60 stalling reporter, a no-insert control, harringtonine runoff, and ZNF598 overexpression or depletion.","For a simpler assay, combine ZNF598 IF or Western blot with eS10/uS10 ubiquitination, puromycin incorporation, and RNase-resistant disome/polysome analysis rather than implementing the full single-molecule system immediately.","The UV experiment is an important control: when ribosome damage becomes global, a limiting RQC factor can become diluted across many substrates, so reduced ZNF598 recruitment at one reporter does not mean less cellular ribosome stress."],"idea":"Compare one ribosome-targeting SG inducer with one SG-negative translation inhibitor at matched global translation suppression. Measure early ZNF598 recruitment or abundance, eS10/uS10 ubiquitination and collision/disome signal, then follow G3BP1 SG formation and later cell death. If the more toxic condition has persistent collisions despite similar ZNF598 abundance, transient ZNF598 overexpression could test whether improving collision clearance reduces toxicity or changes SG persistence."},
{"id":"pmid-41707887","date":"2026-09-09","journal":"Molecules and Cells · 2026 · Kim et al.","title":"A cryo-CLEM-guided workflow for quantitative assessment and optimization of cryo-ET specimen quality","score":"9.7/10","topics":["cryo-clem"],"url":"https://pubmed.ncbi.nlm.nih.gov/41707887/","q":"Can cryo-fluorescence imaging be used not only to target structures for cryo-ET, but also to quantitatively predict lamella quality before expensive tomographic data collection?","gap":"Cryo-CLEM is commonly treated as a targeting step, while lamella quality is often judged only later in the electron microscope. A practical quantitative bridge between fluorescence measurements and cryo-ET specimen quality was missing.","find":"The study quantitatively compared two commercial cryo-CLEM systems using vitrified GFP-labeled cellular specimens. The Leica EM cryo-CLEM configuration provided higher signal-to-noise and faster tile acquisition, whereas the integrated fluorescence microscope provided a wider field of view. Most importantly, fluorescence intensity correlated with lamella thickness, showing that cryo-CLEM can provide early quantitative feedback about specimen quality before cryo-ET acquisition rather than serving only for positional targeting.","use":["This is directly useful for your cryo-CLEM workflow because fluorescence intensity can be treated as a quality-control measurement rather than only a yes/no locator for G3BP1-positive stress-granule regions.","Record fluorescence intensity before and after FIB milling together with measured lamella thickness; over multiple lamellae this can generate a lab-specific calibration curve for choosing the best lamellae for Krios acquisition.","Keep exposure, objective, gain and acquisition settings fixed when comparing lamella fluorescence; otherwise intensity cannot be interpreted quantitatively.","Use background-subtracted signal-to-noise ratio, not raw intensity alone, because cryogenic fluorescence detection is often limited by weak signal and variable background.","For SG cryo-CLEM, include a nearby cytoplasmic fluorescence/background measurement and score whether target visibility is retained after milling; this could help prioritize lamellae where the SG remains confidently localized."],"idea":"During your next G3BP1-GFP cryo-CLEM session, record pre-milling and post-milling GFP intensity, local background and final lamella thickness for every targeted lamella. Plot background-corrected GFP signal or SNR against thickness, then mark whether the SG could later be confidently relocated in cryo-ET. Use the resulting relationship prospectively to rank lamellae for high-resolution acquisition and to determine whether dim SG targets are being lost because of biological signal loss or simply excessive lamella thickness."}
];
let PAPERS=[...NEW_PAPERS];
const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';
function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section class="day"><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}
function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><span class="score">Relevance: ${p.score}</span><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div><div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${p.use.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
async function loadArchive(){try{const r=await fetch('https://raw.githubusercontent.com/zoey501/phd-daily-papers/55c7542f8f1a8c14ffbabd5185e3600b35e21355/index.html',{cache:'no-store'});if(!r.ok)throw new Error('archive fetch failed');const t=await r.text();const m=t.match(/const PAPERS=\[([\s\S]*?)\];\nconst KEY=/);if(!m)throw new Error('archive parse failed');const old=JSON.parse('['+m[1]+']');const ids=new Set(NEW_PAPERS.map(p=>p.id));PAPERS=[...NEW_PAPERS,...old.filter(p=>!ids.has(p.id))];}catch(e){console.error(e)}render()}
render();loadArchive();
</script></body></html>
