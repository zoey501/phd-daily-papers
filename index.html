button><button class="btn" data-view="publication">⭐ Useful for publication</button><button class="btn" data-view="unread">Unread</button></div><div class="filters"><button class="btn active" data-topic="all">All topics</button><button class="btn" data-topic="stress-granules">Stress granules</button><button class="btn" data-topic="ribosome">Ribosome</button><button class="btn" data-topic="translation">Translation</button><button class="btn" data-topic="ribosome-biogenesis">Ribosome biogenesis</button><button class="btn" data-topic="nuclear-speckles">Nuclear speckles</button><button class="btn" data-topic="drug">Drug mechanisms</button><button class="btn" data-topic="cryo-clem">Cryo-CLEM</button></div><div id="paperRoot"></div></div><script>

{"id":"pmid-41419572","date":"2026-11-07","journal":"Nature Cell Biology · online 19 Dec 2025; 28:135–148 (2026) · Smith & Bartel","title":"The G3BP stress-granule proteins reinforce the integrated stress response translation programme","topics":["stress-granules","translation","ribosome"],"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12807861/","paperType":"Original mechanistic and quantitative transcriptomics research. Jarrett Smith and David P. Bartel. Nature Cell Biology 28, 135–148 (2026); published online 19 December 2025. DOI: 10.1038/s41556-025-01834-3; PMID: 41419572; PMCID: PMC12807861. Primary publisher: https://www.nature.com/articles/s41556-025-01834-3","why":"An unusually strong causal test of whether G3BP proteins and stress granules merely accompany translational shutdown or actively shape which mRNAs continue to be translated. Its spike-normalized ribosome profiling, rapid G3BP depletion and light-induced granules separate bulk translation changes from transcript-specific effects.","q":"Do G3BP1/2 and SG assembly actively influence the integrated stress response (ISR) translation programme, and does granule recruitment alter an mRNA's translation?","gap":"Ordinary ribosome profiling obscures absolute global changes; loss of G3BP also eliminates SGs, confounding protein-specific and condensate-specific effects. Whether SG-localized transcripts are translationally silent, protected, or favoured was unresolved.","logic":["Question: How can absolute translation changes be measured during stress? → Add defined translating firefly-luciferase polysomes (ribo-spike) to samples before ribosome profiling → Quantify global suppression and identify stress-resistant/enhanced transcripts → Avoids assuming total RPF abundance is constant.","Question: Are G3BPs required for ISR translation changes? → Auxin-inducible degradation of endogenous G3BP1/2 in HCT116, arsenite or heat shock, ribo-spike profiling → Global shutdown largely persists, but G3BPs modestly strengthen suppression and preferentially favour ISR-resistant transcripts → G3BPs reinforce rather than initiate the ISR programme.","Question: Which transcripts are affected? → Purify SG cores, sequence SG-associated RNA and compare to ribosome footprints → SG-enriched transcripts tend to resist stress-induced translation repression and show G3BP-dependent translation advantage → SG localization correlates with selective translation.","Question: Is condensate formation sufficient without stress? → Light-induced G3BP optogranules (OGs) plus profiling → Modest bulk translation suppression but no full ISR-like transcript selectivity → Condensation alone does not recreate the stress-specific programme.","Question: Does stress determine granule RNA cargo? → Compare SGs, OGs and stress optogranules (SOGs) by RNA sequencing → SOG cargo resembles SG cargo much more closely than unstressed OG cargo → Stress-dependent RNA-binding context helps select transcripts.","Question: Can recruitment causally benefit one mRNA? → MCP–G3BP tethering of reporter mRNA, smFISH, luciferase and RT-qPCR → Reporter recruitment rises and translation is relatively protected under arsenite → Supports a causal role for G3BP association, although direct translation inside SGs is not established."],"figs":["Fig. 1: Firefly-luciferase ribo-spike normalization resolves absolute translation-efficiency changes after 500 µM arsenite for 1 h or heat shock at 45 °C for 25 min; establishes the reference ISR translation programmes.","Fig. 2: G3BP1/2 auxin-degron depletion, PABPC1 microscopy and spike-normalized profiling show that SG loss does not abolish global repression but weakens its selective transcript response.","Figs. 3 and 5: SG-core RNA-seq links granule enrichment to ISR-resistant translation; optogranule versus stress-optogranule transcriptomes demonstrate the importance of stress context.","Figs. 4 and 6: Light-induced granules modestly reduce global translation; MCP–G3BP tethering and reporter assays support enhanced translation of a recruited mRNA."],"find":"G3BPs are not essential for the large ISR-dependent global translation decrease, but enhance selective translation of SG-enriched, stress-resistant mRNAs and modestly strengthen cytosolic repression. Artificial granules alone reduce translation without recreating transcript specificity; the stress environment determines granule RNA composition.","conclusions":["Demonstrated: endogenous G3BP1/2 depletion largely blocks visible SGs under arsenite and heat shock but does not prevent the bulk ISR translation shutdown.","Demonstrated: G3BP-dependent translation changes positively track stress-specific translation preferences; SG-enriched mRNAs are preferentially favoured.","Demonstrated: optogenetic SG-like granules modestly inhibit global translation but do not independently reproduce the ISR transcript-selection programme.","Demonstrated: stress optogranules recruit an SG-like RNA repertoire, and reporter tethering to G3BP increases relative reporter translation during stress.","Interpretation: SGs reinforce selective translation by organizing mRNA availability; direct translation within granules versus at their boundaries or after exit is not conclusively localized."],"info":{"Citation":"Smith J, Bartel DP. Nat Cell Biol 28:135–148 (2026). Online 2025-12-19. DOI 10.1038/s41556-025-01834-3; PMID 41419572.","Model":"Engineered human HCT116 cells with endogenous G3BP1/2 auxin-inducible degrons and fluorescent tags; published U2OS/NIH 3T3/HEK293T datasets used for comparisons.","Perturbation / dose / time":"500 µM sodium arsenite for 1 h; heat shock 45 °C for 25 min; 500 µM IAA for 3 h for rapid G3BP depletion; OG induction used 1 µM doxycycline and blue light (3 h in Fig. 4); SOG protocol included 18 h doxycycline/IAA then 1 h arsenite with blue light during final 30 min.","Markers":"G3BP1, G3BP2, PABPC1-GFP; eIF4G for canonical SG identity; GFP–CRY2–G3BP optogenetic construct.","Assays / imaging":"Spike-normalized ribosome profiling (orthogonal translating firefly-luciferase polysomes), RNA-seq, purified SG-core RNA-seq, fluorescence microscopy, smFISH, luciferase reporter assay, RT-qPCR, immunoblot.","Quantification":"Translation efficiency from ribosome-protected fragments normalized to mRNA abundance and ribo-spike; SG RNA enrichment relative to cytoplasm; reporter recruitment 38% baseline vs 92% with MCP–G3BP; global TE difference about 1.4-fold with G3BPs during arsenite and 1.6-fold after OG induction.","Genetic / controls":"Endogenous AID-tagged G3BP1/2 depletion; doxycycline-inducible OsTIR1; GFP–CRY2–G3BPΔN; blue-light control without optogranule construct; stressed and unstressed samples; tethered versus untethered reporter.","Recovery / statistics":"Reporter arsenite time course 0–90 min, not a washout/recovery design. Fig. 2 SG microscopy n=3 biological replicates; Welch two-sided t-tests in indicated comparisons; SG-enrichment DESeq2 >2-fold and adjusted P<0.05. Other replicate numbers not inferred."},"mechanism":"ISR-inducing stress → eIF2α-dependent global initiation repression and altered RNA-binding landscape → selective enrichment of stress-resistant transcripts in G3BP-dependent SGs → G3BP association enhances relative translation of enriched transcripts while modestly reinforcing cytosolic suppression. The exact physical site of productive translation remains unresolved.","strengths":["Absolute spike-normalized profiling addresses a key measurement bias during global translation collapse.","Rapid endogenous dual G3BP depletion and orthogonal optogenetic condensation provide complementary loss- and gain-of-function tests.","Granule RNA sequencing plus transcript-specific reporter tethering goes beyond morphology-only claims."],"limits":["G3BP depletion removes both protein functions and SGs, so their roles are not completely separable.","Artificial optogranules do not fully recapitulate stress SGs, especially RNA cargo.","Reporter tethering establishes association-dependent translation benefit, not the precise location of protein synthesis.","Stress and cell-type dependence limit generalization to every drug-induced SG."],"novel":"Provides transcriptome-scale absolute translation measurements under stress and causally links G3BP-dependent granule association to selective translation resilience. Distinguishes a modest generic translation-suppression effect of condensation from the stress-dependent sorting that defines an ISR-like programme.","relevance":"For MIT-induced, 60S-enriched SGs, this cautions against equating SG abundance with global translation inhibition or assuming all SGs share the same RNA cargo. Compare SG morphology with puromycin incorporation and selected transcript localization; a different ribosomal composition may imply distinct translational outcomes, not necessarily stronger repression.","idea":"Hypothesis: MIT SGs preferentially retain a different set of stress-resistant mRNAs than arsenite SGs even at matched bulk translation inhibition. Minimal groups: vehicle, MIT, arsenite; optionally G3BP1/2 depletion as a mechanistic control. Readouts: SUnSET/OPP global translation, G3BP1 IF and smFISH for ATF4 or DDIT3 versus a translation-sensitive control transcript, with cytoplasmic RNA normalization. If RNA recruitment differs at matched translation suppression, SG cargo selection is drug-specific; if similar, translation state may dominate. Interpret ATF4 mRNA versus protein separately because its ISR translation is uORF-regulated."},
{"id":"pmid-42214329","date":"2026-11-06","journal":"Molecular Cell · 18 June 2026 · Vind et al.","title":"Mechanism of RACK1-dependent ZAKα activation at stalled and collided ribosomes","topics":["ribosome","translation","drug"],"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC13293227/","paperType":"Original mechanistic research. Vind AC, Martínez JF, Wu Z et al. Molecular Cell 86(12), 2341–2357.e10 (2026). Online 29 May 2026; issue 18 June 2026. DOI 10.1016/j.molcel.2026.04.034; PMID 42214329. Primary full text: https://pmc.ncbi.nlm.nih.gov/articles/PMC13293227/.","why":"Resolves a central ambiguity in ribotoxic-stress biology: how ZAKα can sense both single stalled ribosomes and collided ribosomes. The study links structural interaction predictions to biochemical binding, genetic rescue and nucleotide-resolution RNA contacts.","q":"How does ZAKα physically monitor translating ribosomes and become activated when translation stalls or ribosomes collide?","gap":"Collision-driven ZAKα signaling was established, but a molecular sensor that could explain both collision-dependent and collision-independent ribotoxic stress remained unclear. Whether ZAKα contacts mRNA itself, and how that contact changes with ribosome movement, was not known.","logic":["Question: Which ribosomal surface recruits ZAKα? → AlphaFold3 complex predictions, haploid genetic screen, ribosome sedimentation and deletion rescue → RACK1 and RPS27 interfaces emerge, with RACK1 essential → Positions ZAKα near the 40S mRNA exit channel.","Question: Are the predicted contacts functionally important? → RACK1-binding-motif deletions, RACK1 knockout/rescue and ITC → ZAKα Δ417–422/Δ611–617 lose anisomycin responsiveness; a WT peptide binds RACK1 (Kd ~11 μM) → Specific protein contacts are required for ribotoxic signaling.","Question: Does ZAKα bind RNA where the model predicts? → ZAKα iCLIP after initiation-stalling drugs and RNA-binding mutant comparisons → Crosslinks accumulate ~10 nt upstream of initiation codons under lactimidomycin; RNA-binding-deficient mutants lose crosslinking → ZAKα senses exposed mRNA near the exit channel.","Question: Can a single stalled ribosome signal? → Lactimidomycin/harringtonine initiation stalling and immunoblot signaling assays → ZAKα activates without requiring a collision interface in every condition → Ribosome stalling itself can initiate the RSR.","Question: Why are collisions stronger signals? → Structural modeling and activation-mutant tests interpreted alongside collision perturbations → Extended ribosome residence and proximity of ZAKα molecules favor transient dimerization/autophosphorylation → A common processivity-sensing model accommodates both situations."],"figs":["Fig. 1: AlphaFold3 interaction maps, haploid-cell screen and U2OS ΔZAK rescue identify RACK1-binding motifs necessary for anisomycin-induced ZAKα activation; HAP1 ΔRACK1 ribosome pelleting supports recruitment.","Fig. 2: ITC measures binding of a ZAKα peptide to RACK1 (WT Kd ~11 μM); RACK1 dAH mutant fails to restore ZAKα activation in ΔRACK1 HAP1 cells; iCLIP tests RNA contacts.","Fig. 5: Initiation-specific stalling conditions (including harringtonine) test whether single stalled ribosomes can activate ZAKα rather than requiring detectable collisions.","Fig. 6: ZAKα iCLIP around start codons after lactimidomycin/harringtonine and mechanistic diagrams connect mRNA-exit-channel contact with ribosome processivity."],"find":"ZAKα surveys the mRNA exit channel through RACK1, RPS27, 18S rRNA helix 26 and emerging mRNA. Stalled ribosomes prolong ZAKα residence and can activate it; collisions enhance signaling. The authors propose that prolonged association permits SAM-domain-dependent dimerization and trans-autophosphorylation.","conclusions":["Demonstrated: RACK1 and defined ZAKα binding motifs are necessary for robust anisomycin-triggered ZAKα activation in the tested genetic systems.","Demonstrated: ZAKα crosslinks to mRNA near the expected exit-channel region; initiation-stalling agents produce start-codon-proximal iCLIP signals.","Demonstrated: initiation-stalling treatments can trigger ZAKα signaling, supporting sensing of individual stalled ribosomes.","Model supported by combined evidence: slower mRNA movement increases ZAKα dwell time; collisions increase local opportunities for ZAKα dimerization.","Interpretation, not direct visualization of every transition: transient SAM-domain exposure, dimerization and activation-loop trans-autophosphorylation explain the strong collision preference."],"info":{"Citation":"Vind AC et al. Mol Cell 86:2341–2357.e10 (2026). Online 2026-05-29; issue 2026-06-18. DOI 10.1016/j.molcel.2026.04.034; PMID 42214329.","Models":"Human HAP1 WT/ΔRACK1; U2OS ΔZAK reconstituted with tagged WT or mutant ZAKα; additional cellular systems described in the primary article.","Perturbations":"Anisomycin; lactimidomycin (LTM); harringtonine (HAR); GSPT1/ERF3 degrader CC-885; genetic deletion/rescue of RACK1 and ZAKα mutants.","Verified doses/times":"Anisomycin 1 μM for 1 h (Fig. 1D/J); LTM 15 μM for 60 min (iCLIP); HAR 30 μM for 1 h (iCLIP); CC-885 for 6 h (dose not verified here). These are study-specific conditions.","Markers":"ZAKα ribosome association and phosphorylation; downstream p38/JNK signaling; RACK1, RPS27, 18S rRNA helix 26; GSPT1 protein loss.","Assays / imaging":"AlphaFold3 modeling; ZAKα iCLIP and start-codon metagene analysis; immunoblot; sucrose-cushion ribosome pelleting; isothermal titration calorimetry; RNA electrophoretic mobility shift assay.","Genetics / controls":"HAP1 WT vs ΔRACK1 with WT or dAH RACK1 rescue; U2OS ΔZAK with WT vs Δ417–422/Δ611–617 ZAKα rescue; WT versus mutated RACK1-binding peptide; RNA-binding-deficient ZAKα mutant.","Quantification":"ITC WT-peptide Kd ~11 μM; ZAKα iCLIP peak ~10 nt upstream of initiation codon after LTM. No unverified replicate counts or statistical tests supplied.","Recovery / imaging":"No core washout/recovery experiment or fluorescence microscopy quantification was verified for the highlighted mechanism."},"mechanism":"Normally moving mRNA → transient ZAKα contacts with RACK1/RPS27/18S helix-26 and exiting mRNA → rapid dissociation. Stalling → reduced mRNA movement → prolonged ZAKα residence → proposed SAM-dependent transient dimerization and activation-loop phosphorylation → p38/JNK ribotoxic stress response. Collision → nearby ribosome-bound ZAKα molecules → enhanced activation probability (model).","strengths":["Integrates interaction prediction, direct biochemical binding, genetic epistasis and RNA crosslink mapping.","Uses initiation-specific stalling to test the single-ribosome alternative rather than assuming collisions are required.","Explicitly compares different ribotoxic inputs and interrogates separation-of-function mutants."],"limits":["The proposed full-length ZAKα orientation and transient activation transitions are not all directly visualized in situ.","Authors note that direct biochemical characterization of S/CTD–mRNA binding remains incomplete; further NMR/EMSA studies are needed.","Phospho-ZAKα or p38/JNK alone cannot quantify collision abundance or prove a disome mechanism."],"novel":"Provides a physically grounded explanation for how one kinase can surveil ribosome processivity, responding to both stalling and collisions. The mRNA-exit-channel contact and functional RACK1-binding motifs make the model experimentally falsifiable rather than a generic 'collision sensor' description.","relevance":"For drug-induced SGs, the key lesson is not to interpret ZAKα activation as definitive evidence of ribosome collision. Compare p-ZAKα/p38 with collision-specific measurements and SG readouts, especially for compounds producing unusual 60S-enriched condensates.","idea":"Hypothesis: an SG-inducing drug triggers ZAKα through ribosome stalling even when stable disomes are scarce. Minimal groups: vehicle, candidate drug, anisomycin collision-positive control, and candidate plus ZAK knockdown. Readouts: phospho-p38/JNK, G3BP1 SG fraction and RNase-resistant disome profile (with puromycin incorporation to measure translation). If ZAK activates without disomes, stalling/alternative ribotoxic signaling is plausible; if disomes and ZAK both rise, collision-associated signaling is supported; if ZAK depletion changes SGs, test translation changes before claiming a direct SG role."},
{"id":"doi-10.1038-s41556-026-01936-6","date":"2026-11-05","journal":"Nature Cell Biology · 30 April 2026 · Douglas et al.","title":"The atypical E3 ligase HOIL-1 safeguards the ribosome during cellular stress","topics":["ribosome","translation","drug"],"url":"https://www.nature.com/articles/s41556-026-01936-6","paperType":"Original mechanistic cell biology / ribosome quality control / metabolic stress. Douglas T, Nie P, Zhang J et al. Nature Cell Biology 28:930–945 (2026). Published 30 April 2026. DOI: 10.1038/s41556-026-01936-6. PMID not independently verified.","why":"Connects ribosome ubiquitination and ribotoxic-stress signaling to an unexpected metabolic cell-death decision. Particularly valuable because it experimentally distinguishes ribosome stalling from collisions instead of treating them as synonymous.","q":"How does HOIL-1 protect cells from nutrient and translation stress, and why does loss of its RBR domain make glucose starvation lethal?","gap":"HOIL-1 was known for immune signaling and glycogen ubiquitination, but its contribution to ribosome surveillance and the lethal metabolic phenotype of HOIL-1-deficient disease was unknown. Whether nutrient stress activates ZAKα through collisions or stalled ribosomes was also unresolved.","logic":["Question: Does HOIL-1 loss change vulnerability to metabolic stress? → Compare parental and HOIL-1 ΔRBR/KO cells during glucose starvation → Mutant cells show excess death → HOIL-1 is protective during nutrient stress.","Question: What causes death? → Metabolomics, xCT inhibition/knockout and redox rescue → xCT-dependent disulfide stress and disulfidptosis account for much of the phenotype → Metabolic vulnerability has a specific effector.","Question: Which upstream signal drives the response? → ZAK silencing, phospho-ZAKα/p38/JNK and ATF4 immunoblots → ZAK signaling and ATF4 induction are enhanced in HOIL-1 ΔRBR cells → Ribotoxic signaling links nutrient stress to cell death.","Question: Does HOIL-1 protect ribosome quality control? → Anisomycin challenge, RPS10/RPS20 ubiquitination, RNase-resistant disome profiling → HOIL-1 loss blunts ribosome ubiquitination and increases collisions under anisomycin → HOIL-1 supports a cytoprotective ribosome quality-control response.","Question: Are glucose-starvation and anisomycin signals identical? → Polysome/disome profiles and EDF1/GIGYF2 shifts → Glucose starvation activates ZAKα without a detectable disome peak → Stalling rather than overt collisions is the favored explanation in this context.","Question: How does HOIL-1 connect to the ribosome machinery? → MiniTurbo proximity labeling, PABPC1/MKRN1 interaction and rescue experiments → HOIL-1 ΔRBR alters an RNA-binding-protein network including PABPC1 and MKRN1 → A plausible molecular bridge to ribosome ubiquitination."],"figs":["Fig. 3: xCT knockout or inhibitors erastin/sulfasalazine suppress glucose-starvation death; GSH-related interventions dissect the redox mechanism.","Fig. 5: Phospho-ZAKα/p38/JNK and ZAK knockdown connect nutrient stress to ATF4 and cell death; arsenite is an informative comparison.","Fig. 6: Anisomycin-dependent RPS10/RPS20 ubiquitination, RNase-treated disome profiles, and glucose-starvation profiles separate collision-rich from collision-poor ribotoxic responses.","Fig. 7: HOIL-1 ΔRBR MiniTurbo proximity labeling, PABPC1–MKRN1 interactions and expression perturbations probe the upstream protective machinery."],"find":"HOIL-1 loss of function increases susceptibility to glucose starvation and several ribotoxic insults. The HOIL-1 RBR domain supports ribosomal protein ubiquitination and restrains prolonged ZAKα signaling. Glucose starvation in mutant cells activates a ZAKα–ATF4–xCT axis culminating in disulfidptosis, yet unlike anisomycin it does not produce a detectable RNase-resistant disome peak.","conclusions":["Demonstrated: HOIL-1-deficient cells are more vulnerable to glucose starvation and translational stress.","Demonstrated: HOIL-1 loss impairs stress-associated RPS10/RPS20 ubiquitination under anisomycin.","Demonstrated: ZAK knockdown and xCT inhibition/knockout rescue major components of glucose-starvation death in the ΔRBR model.","Demonstrated: anisomycin yields detectable disomes, whereas prolonged glucose starvation did not in the tested system.","Interpretation: glucose starvation probably activates ZAKα via stalled ribosomes rather than frequent stable collisions; absence of a disome peak does not exclude rare/transient collisions."],"info":{"Citation":"Douglas T, Nie P, Zhang J et al. Nat Cell Biol 28, 930–945 (2026). Published 2026-04-30. DOI 10.1038/s41556-026-01936-6. Primary article: https://www.nature.com/articles/s41556-026-01936-6.","Models":"Human AC16 cardiomyocyte-derived cells, 786-O cells, mouse embryonic fibroblasts (MEFs), HOIL-1 ΔRBR and knockout models; mouse cardiac phenotypes.","Perturbations":"Glucose-free medium with 10% dialyzed FBS; anisomycin, harringtonine, hygromycin and UV-C; HOIL-1, ZAK, xCT, PABPC1/MKRN1 pathway perturbations.","Verified doses/times":"Anisomycin 5 µM for 1 h in RNase-disome profiling of AC16 cells; 5 µM for 24 h in AC16 viability assay; glucose starvation 24 h for disome profiles; MiniTurbo proximity labeling after 6 h glucose starvation; arsenite 10 µM for 8 h in a PABPC1-GFP immunoblot comparison. Do not transfer these conditions uncritically to other cell lines.","Markers":"RPS10/RPS20 ubiquitination; phospho-ZAKα (Phos-Tag), p38/JNK phosphorylation, ATF4, xCT/SLC7A11, EDF1 and GIGYF2; PABPC1 and MKRN1.","Assays / imaging":"Immunoblot/densitometry, Phos-Tag gels, RNase A-treated sucrose polysome/disome profiling, metabolomics, MiniTurbo proximity proteomics, co-immunoprecipitation, cell death assays, GFP/RFP poly(A)-stall reporter.","Genetic controls":"Parental vs HOIL-1 ΔRBR/KO; ZAK or non-targeting siRNA; xCT KO; GCN1/GCN2 and eIF2α-kinase depletion; GFP-MiniTurbo proximity-labeling control.","Quantification/statistics":"RPS10/RPS20 ubiquitination densitometry from three independent experiments, normalized to within-experiment maximum; Fig. 6 cell death n=3–4 biological replicates with two-way ANOVA/Holm–Šídák comparisons.","Recovery":"A washout/recovery design was not established for the core Fig. 6 ribosome experiments in the inspected primary text."},"mechanism":"HOIL-1 RBR-dependent control of ribosome ubiquitination / PABPC1–MKRN1 network → suppression of excessive ZAKα ribotoxic signaling. Under HOIL-1 ΔRBR plus glucose deprivation: ribosome stress (likely stalling; not demonstrated stable disomes) → ZAKα activation → ATF4 upregulation → xCT elevation → cystine/disulfide stress → disulfidptosis.","strengths":["Strong genetic epistasis and pharmacological rescue connect ZAK and xCT to death rather than merely correlating their expression.","Direct collision-sensitive RNase-disome assays provide a useful distinction between two forms of ribosome stress.","Multiple cell models, ubiquitination kinetics, proximity proteomics and mechanistic follow-up reinforce the pathway."],"limits":["Absence of a detectable disome peak does not establish that no transient collisions occur.","HOIL-1 has several biochemical functions, so attributing every phenotype exclusively to a direct ribosomal substrate is premature.","Glucose-starvation death mechanisms and stress kinetics are context-dependent; not every cell type will undergo xCT-mediated disulfidptosis."],"novel":"Identifies HOIL-1 as an unexpected regulator of ribosome ubiquitination and ribotoxic signaling, connecting a metabolic stress phenotype to ribosome surveillance. Most importantly, shows that ZAKα-dependent outcomes can arise under glucose starvation without the strong collision signature seen with anisomycin.","relevance":"For distinguishing drug-induced RSR from ISR, ZAKα/p38/JNK and RPS10/RPS20 ubiquitination are informative alongside p-eIF2α. The study cautions that ZAK activation alone cannot prove ribosome collision, especially in SG-positive drug treatments.","idea":"Hypothesis: a candidate SG-inducing drug activates ZAKα without producing stable disomes. Minimal groups: vehicle, candidate drug, anisomycin positive control, and candidate ± ZAK knockdown. Readouts: phospho-ZAKα/p38, RPS10/RPS20 ubiquitination, G3BP1 SGs, and RNase-resistant disome profile if feasible. If ZAK activation occurs without disomes, investigate stalling/alternative ribotoxic inputs; if disomes rise with ubiquitination, collision-associated RQC is supported; if ZAK knockdown alters SGs, test whether this reflects altered stress signaling rather than simply altered translation."},
{"id":"pmid-42636110","date":"2026-09-29","journal":"Cell Reports · 2026 · Macedo de Vasconcelos, Ripin & Parker","title":"Zinc increases stress granule formation by promoting RNA condensation","topics":["stress-granules","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/42636110/","paperType":"Mechanistic cell biology / biomolecular condensation","why":"A particularly clean paper for separating stress-granule assembly from translational repression. It shows that the intracellular chemical environment can tune SG formation directly through RNA condensation, rather than simply by changing how strongly translation is shut down.","q":"Does intracellular zinc directly regulate stress-granule assembly, and if so, does it act through translation repression or through the physical chemistry of RNA condensation?","gap":"SG assembly requires released mRNA and G3BP proteins, but how physiological changes in intracellular ions alter RNA–RNA and RNA–protein condensation in cells was poorly defined. Zinc is tightly buffered and rises during some oxidative stresses, yet its contribution to SG assembly was unknown.","logic":["Question: Does stress alter labile intracellular zinc? → Method: fluorescent zinc sensing during oxidative and non-oxidative stresses → Result: arsenite and H2O2 increased labile zinc, whereas translation inhibition/ER stress did not show the same response → Meaning: zinc elevation is a stress-context-dependent variable rather than an automatic consequence of translation arrest.","Question: Does zinc change SG assembly? → Method: increase or chelate intracellular zinc and quantify SGs → Result: added zinc increased SG formation and delayed disassembly, while zinc depletion reduced SG formation → Meaning: endogenous labile zinc is sufficient to tune SG dynamics.","Question: Is the effect simply stronger translation repression? → Method: puromycin incorporation and eIF2α-phosphorylation readouts → Result: zinc-enhanced SG formation occurred without increased translational repression → Meaning: zinc acts downstream or in parallel to the canonical translation-shutdown trigger.","Question: Does zinc act through cellular zinc buffering? → Method: manipulate metallothionein/MTF1-dependent zinc sequestration → Result: increasing zinc sequestration reduced SG formation, whereas reducing the buffering response increased it → Meaning: cells actively limit the condensate-promoting effect of free zinc.","Question: Can zinc directly promote RNA condensation? → Method: in-vitro RNA and RNA–G3BP1 condensation with divalent ions → Result: Zn2+ stimulated RNA condensation at roughly 100-fold lower concentrations than Mg2+ and altered RNA–G3BP1 condensates → Meaning: zinc can directly change RNA interaction/condensation chemistry."],"figs":["Key experiment — live/fluorescent zinc measurements compare oxidative stress with other translation-stress conditions; exact figure number not verified from accessible primary full text.","Key experiment — zinc addition versus zinc chelation combined with SG imaging demonstrates bidirectional control of SG assembly; exact figure number not verified.","Key experiment — puromycin incorporation and p-eIF2α separate SG enhancement from additional translation repression; exact figure number not verified.","Key experiment — purified RNA ± G3BP1 condensation with Zn2+, Mg2+ and chelation provides the direct mechanistic test; exact figure number not verified."],"find":"Oxidative stress raises labile intracellular zinc and induces zinc-sequestering metallothioneins. Increasing intracellular zinc enhances SG formation and delays SG disassembly, whereas zinc depletion suppresses SG formation. Importantly, this occurs without stronger translational repression. In vitro, Zn2+ directly promotes RNA condensation at approximately 100-fold lower concentrations than Mg2+, supporting a direct physicochemical route from zinc availability to SG assembly.","conclusions":["Labile intracellular zinc is a tunable regulator of SG formation and disassembly.","Zinc-enhanced SG formation can be uncoupled from the magnitude of translational repression.","Metallothionein-dependent zinc buffering limits this effect in cells.","Direct promotion of RNA condensation provides a mechanistic explanation for zinc-dependent SG enhancement."],"info":{"Citation":"Macedo de Vasconcelos L, Ripin N, Parker R. Cell Reports 45(9):117870 (2026). DOI 10.1016/j.celrep.2026.117870; PMID 42636110.","Models":"U-2 OS, A549 and HEK293T are reported in the study; PubMed indexing specifically includes HeLa cells as well.","Stress / perturbations":"Oxidative stress including sodium arsenite and H2O2; intracellular zinc increase/depletion; metallothionein/MTF1 perturbation; TIA1 depletion; in-vitro divalent-ion perturbation.","SG machinery / markers":"G3BP1/G3BP2 are central SG components; TIA1 was tested mechanistically. Exact antibody catalog numbers were not verified.","Zinc readout":"FRET-based ZapCV2 zinc sensor was used to monitor labile intracellular zinc.","Translation readouts":"Puromycin labeling and eIF2α phosphorylation were used to test whether zinc caused additional translational repression.","RNA assays":"RNA FISH and in-vitro RNA condensation/co-condensation with recombinant GFP-G3BP1.","Verified in-vitro conditions":"ZnCl2 promoted RNA condensation at 150–500 µM in a reported 150 mM NaCl/10% PEG condition; Mg2+/Ca2+ required roughly 10–12 mM for a comparable effect. In RNA–G3BP1 assays, 50 µM ZnCl2 altered condensate morphology, compared with ~10 mM MgCl2.","Controls":"Zinc chelation, Mg2+/Ca2+ comparison, translation-stress conditions that do not raise zinc, metallothionein buffering, TIA1 knockdown, and chelator reversal of in-vitro condensates.","Recovery design":"SG disassembly after stress was followed; elevated zinc delayed disassembly. Exact time points were not verified from accessible primary full text."},"mechanism":"Oxidative stress → rise in labile Zn2+ → stronger intermolecular RNA condensation / altered RNA–G3BP1 co-condensation → increased and more persistent SG assembly. Metallothionein induction buffers Zn2+ and restrains this pathway. The direct RNA-condensation step is supported by in-vitro reconstitution; how much free Zn2+ directly contacts RNA inside SGs remains an interpretation requiring further in-cell validation.","strengths":["Combines live-cell ion sensing, SG imaging, translation readouts, genetic/buffering perturbations and biochemical reconstitution.","Crucially distinguishes 'more SGs' from 'more translation inhibition'.","Bidirectional zinc manipulation and in-vitro ion comparisons make the causal argument substantially stronger than correlation alone."],"limits":["The exact molecular coordination sites by which Zn2+ promotes RNA–RNA interactions in cells are not directly mapped.","In-vitro condensate conditions simplify the crowded and highly buffered intracellular environment.","The degree to which zinc explains SG differences across unrelated stresses or cell types remains open."],"novel":"The paper adds a physicochemical control layer to SG biology: SG abundance is not determined only by translation shutdown and canonical SG proteins. A physiologically regulated divalent ion can directly alter RNA condensation and thereby tune granule assembly and persistence.","relevance":"For drug-induced SG work, this warns against interpreting stronger SG formation as automatically meaning stronger translation inhibition. It supports measuring a second axis—condensate chemistry/assembly competence—when two drugs produce similar translation suppression but very different SG phenotypes.","idea":"Hypothesis: one of your drug-induced SG phenotypes is amplified by condensate chemistry rather than by stronger translation inhibition. Minimal groups: vehicle, MIT, arsenite, each ± a zinc chelator compatible with the cells. Readouts: G3BP1 SG+ fraction/area/number, SUnSET or puromycin incorporation, p-eIF2α, and RPL7 SG partition coefficient. If chelation reduces SGs without restoring translation, that supports a condensation-level effect; if SG loss tracks translation recovery, zinc is more likely acting upstream through stress signaling."},

const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}'),view='today',topic='all';const flags=id=>state[id]||{read:false,pub:false};function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]));function detailed(p){return `<p class="summary"><span class="pill">Detailed report</span>${esc(p.why)}</p><details class="details"><summary>Read detailed paper report</summary><div class="section"><b>Paper information / type</b><p>${esc(p.paperType)}</p></div><div class="section"><b>Main scientific question</b><p>${esc(p.q)}</p></div><div class="section"><b>Knowledge gap / problem</b><p>${esc(p.gap)}</p></div><div class="section"><b>Main experimental logic</b><ol class="logic">${p.logic.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="section"><b>Key experiments / main figures</b>${p.figs.map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="section"><b>Main findings</b><p>${esc(p.find)}</p></div><div class="section"><b>Main conclusions</b><ul>${p.conclusions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Key experimental information extracted</b><div class="info-grid">${Object.entries(p.info).map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join('')}</div></div><div class="section"><b>Mechanistic model</b><p>${esc(p.mechanism)}</p></div><div class="section"><b>Strengths</b><ul>${p.strengths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Limitations</b><ul>${p.limits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>What is genuinely new?</b><p>${esc(p.novel)}</p></div><div class="section"><b>Possible relevance to your work</b><p>${esc(p.relevance)}</p></div><div class="section"><b>One experiment inspired by this paper</b><p>${esc(p.idea)}</p></div></details>`}function old(p){return `<div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${(p.use||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div>`}function card(p){let f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div>${p.logic?detailed(p):old(p)}<div class="section"><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div></article>`}function render(){let latest=[...PAPERS].map(p=>p.date).sort().reverse()[0],ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);let by={};ps.forEach(p=>(by[p.date]??=[]).push(p));paperRoot.innerHTML=ps.length?Object.keys(by).sort().reverse().map(d=>`<section><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join(''):'<div class="empty">No papers in this view yet.</div>';document.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));document.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});render();</script></body></html>
