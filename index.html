<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhD Daily Papers</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#182033;--muted:#6c7689;--line:#e4e8f0;--accent:#405cf5;--soft:#eef1ff;--gold:#fff4cf}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:34px 20px 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{font-size:36px;margin:0 0 6px}.muted{color:var(--muted)}.views,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}.filters{margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:var(--text);color:#fff}.day{margin-top:30px}.day h2{font-size:18px;margin:0 0 12px;color:var(--muted)}.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 7px 24px rgba(26,36,58,.05)}.meta{font-size:14px;color:var(--muted)}.paper h3{font-size:24px;line-height:1.3;margin:7px 0 10px}.score{display:inline-block;background:#edf8ef;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.section{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.section b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}.section p,.section li{line-height:1.55}.actions{display:flex;gap:15px;flex-wrap:wrap;margin:17px 0 13px;padding:12px;background:#fafbfe;border-radius:12px}.actions label{font-weight:700;font-size:14px}.actions input{width:17px;height:17px;vertical-align:-3px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.paper a{color:var(--accent);font-weight:800;text-decoration:none}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);margin-top:25px}.saved{background:var(--gold)}@media(max-width:650px){.top h1{font-size:30px}.paper{padding:18px}.paper h3{font-size:20px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>🔬 PhD Daily Papers</h1><div class="muted">1–2 papers a day, summarized for your research.</div></div><div class="muted" id="todayLabel"></div></div>
<div class="views"><button class="btn active" data-view="today">Today</button><button class="btn" data-view="archive">Archive</button><button class="btn" data-view="publication">⭐ Useful for publication</button><button class="btn" data-view="unread">Unread</button></div>
<div class="filters"><button class="btn active" data-topic="all">All topics</button><button class="btn" data-topic="stress-granules">Stress granules</button><button class="btn" data-topic="ribosome">Ribosome</button><button class="btn" data-topic="translation">Translation</button><button class="btn" data-topic="ribosome-biogenesis">Ribosome biogenesis</button><button class="btn" data-topic="nuclear-speckles">Nuclear speckles</button><button class="btn" data-topic="drug">Drug mechanisms</button><button class="btn" data-topic="cryo-clem">Cryo-CLEM</button></div>
<div id="paperRoot"></div>
</div>
<script>
const PAPERS=[
{id:'pmid-41747727',date:'2026-08-25',journal:'Cell · 2026',title:'Nuclear speckles enable processing of RNA from GC-rich isochores',score:'9.2/10',topics:['nuclear-speckles'],url:'https://pubmed.ncbi.nlm.nih.gov/41747727/',q:'What essential function do nuclear speckles provide in human gene expression, and which transcripts depend on them?',gap:'Nuclear speckles are prominent condensates rich in splicing factors, but it has been difficult to separate a true functional requirement for speckles from the individual functions of their resident proteins.',find:'Acute engineered removal of the speckle core proteins SON and SRRM2 disrupted speckles and selectively impaired processing of GC-rich genes with short, leveled exon–intron architecture. The major defect was chaotic splicing, including extensive exon skipping and intron retention, with reduced binding of phosphorylated SR proteins and SF3B1 at speckle-dependent exons.',use:['SON and SRRM2 are strong structural markers/perturbation points for nuclear-speckle experiments.','The study combines immunofluorescence, acute protein depletion, RNA-seq/splicing analysis, chromatin/speckle proximity measurements and RNA FISH.','A useful lesson for imaging: changes in speckle morphology should be linked to a functional RNA-processing readout rather than interpreted alone.'],idea:'If one of your drugs changes nuclear-speckle morphology, quantify SON or SRRM2 organization together with a defined RNA-processing or transcriptional readout. This would distinguish simple morphology changes from a biologically meaningful speckle perturbation.'},
{id:'pmid-41551405',date:'2026-08-25',journal:'NAR Cancer · 2026',title:'Ribosome biogenesis is increased in hepatocellular carcinoma and represents a potential therapeutic target',score:'8.8/10',topics:['ribosome','ribosome-biogenesis','drug'],url:'https://pubmed.ncbi.nlm.nih.gov/41551405/',q:'Can elevated nucleolar/ribosome-biogenesis activity identify cancers that are especially vulnerable to nucleolar-targeting drugs?',gap:'High ribosome biogenesis is common in cancer, but it is not always clear whether that phenotype creates a therapeutically exploitable vulnerability or which measurable nucleolar features predict sensitivity.',find:'A pan-cancer tissue screen highlighted liver cancer. HCC samples and cell lines showed increased Treacle, UBF and Fibrillarin and higher rRNA production. HCC cells were more sensitive than normal liver cells to nucleolar-targeting compounds, and Treacle/Fibrillarin increased with tumour progression.',use:['Useful nucleolar markers: Treacle/TCOF1, UBF and Fibrillarin, alongside rRNA measurements.','The paper quantifies nucleolar intensity, nucleolar number, size and total nucleolar area—directly adaptable to IF image analysis.','It compares nucleolar-targeting compounds with Sorafenib and normal versus tumour cells, providing a strong selectivity-control framework.'],idea:'For your drug panel, quantify NPM1 plus one ribosome-biogenesis marker such as Fibrillarin or UBF, then compare nucleolar disruption with SG induction and puromycin-based translation inhibition. This could reveal whether some SG-inducing drugs also produce nucleolar stress.'},
{id:'pmid-42524886',date:'2026-08-24',journal:'Journal of Cell Biology · 2026',title:'PARP1 hyperactivity stalls translation and triggers stress granule formation following DNA damage',score:'9.8/10',topics:['stress-granules','translation','drug'],url:'https://pubmed.ncbi.nlm.nih.gov/42524886/',q:'How does nuclear DNA damage signal to the cytoplasmic translation machinery to inhibit translation and induce stress granules?',gap:'Genotoxic stress can induce SGs, but the signaling route connecting nuclear DNA damage to cytoplasmic translation arrest was unclear.',find:'PARP1 hyperactivity depletes NAD+ and ATP, activates AMPK, suppresses mTORC1 through Raptor and 4EBP1, inhibits translation and promotes SG assembly. G3BP1/2-deficient cells showed reduced viability after genotoxic stress, supporting a protective SG function.',use:['Measure p-eIF2α together with mTORC1/4EBP1 readouts when classifying non-canonical SGs.','Use G3BP1/2-deficient cells or SG-defective conditions to test whether SGs influence survival rather than merely correlate with it.','NAD+/ATP rescue experiments show how metabolic perturbations can identify pathway order.'],idea:'For a strong drug-induced SG condition, combine live SG-onset/death tracking with p-eIF2α and 4EBP1 pathway measurements at matched time points.'},
{id:'pmid-41042876',date:'2026-08-23',journal:'Science Advances · 2025',title:'Translation landscape of stress granules',score:'10/10',topics:['stress-granules','ribosome','translation','cryo-clem'],url:'https://pubmed.ncbi.nlm.nih.gov/41042876/',q:'Which ribosomal and translation-related complexes are actually present inside stress granules in intact cells?',gap:'Fluorescence enrichment of ribosomal proteins cannot reveal whether intact ribosomal subunits or translating ribosomes occupy SGs.',find:'Cryogenic correlative imaging and electron tomography directly examined translation-related complexes within SG regions, supporting selective partitioning rather than simple sequestration of all ribosomes.',use:['A direct methodological reference for SG cryo-CLEM/cryo-ET.','Compare SG regions with nearby cytoplasm under the same condition.','Distinguish ribosomal-protein fluorescence from the structural state of 40S, 60S or 80S particles.'],idea:'Use IF to select a drug with reproducibly strong RPL7 enrichment, compare 40S and 60S markers against arsenite, and only then prioritize that condition for cryo-ET.'}
];
const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';
function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section class="day"><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}
function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><span class="score">Relevance: ${p.score}</span><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div><div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${p.use.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});render();
</script></body></html>
