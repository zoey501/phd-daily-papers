<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhD Daily Papers</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#182033;--muted:#6c7689;--line:#e4e8f0;--accent:#405cf5;--soft:#eef1ff;--gold:#fff4cf}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:34px 20px 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{font-size:36px;margin:0 0 6px}.muted{color:var(--muted)}.views,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}.filters{margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:var(--text);color:#fff}.day{margin-top:30px}.day h2{font-size:18px;margin:0 0 12px;color:var(--muted)}.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 7px 24px rgba(26,36,58,.05)}.meta{font-size:14px;color:var(--muted)}.paper h3{font-size:24px;line-height:1.3;margin:7px 0 10px}.score{display:inline-block;background:#edf8ef;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.section{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.section b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}.section p,.section li{line-height:1.55}.actions{display:flex;gap:15px;flex-wrap:wrap;margin:17px 0 13px;padding:12px;background:#fafbfe;border-radius:12px}.actions label{font-weight:700;font-size:14px}.actions input{width:17px;height:17px;vertical-align:-3px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.paper a{color:var(--accent);font-weight:800;text-decoration:none}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);margin-top:25px}.saved{background:var(--gold)}@media(max-width:650px){.top h1{font-size:30px}.paper{padding:18px}.paper h3{font-size:20px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>🔬 PhD Daily Papers</h1><div class="muted">1–2 papers a day, summarized for your research.</div></div><div class="muted" id="todayLabel"></div></div>
<div class="views"><button class="btn active" data-view="today">Today</button><button class="btn" data-view="archive">Archive</button><button class="btn" data-view="publication">⭐ Useful for publication</button><button class="btn" data-view="unread">Unread</button></div>
<div class="filters"><button class="btn active" data-topic="all">All topics</button><button class="btn" data-topic="stress-granules">Stress granules</button><button class="btn" data-topic="ribosome">Ribosome</button><button class="btn" data-topic="translation">Translation</button><button class="btn" data-topic="ribosome-biogenesis">Ribosome biogenesis</button><button class="btn" data-topic="nuclear-speckles">Nuclear speckles</button><button class="btn" data-topic="drug">Drug mechanisms</button><button class="btn" data-topic="cryo-clem">Cryo-CLEM</button></div>
<div id="paperRoot"></div></div>
<script>
const PAPERS=[
{"id":"pmid-40952561","date":"2026-08-29","journal":"Molecular and Cellular Biochemistry · 2026","title":"The many ways to inhibit translation by Sorafenib in liver cancer cells","score":"9.6/10","topics":["translation","ribosome","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/40952561/","q":"Which translation-control pathways are responsible for the rapid inhibition of protein synthesis caused by the anticancer drug sorafenib?","gap":"Sorafenib was known to inhibit translation in hepatocellular carcinoma cells, but the relative contributions of the ISR, eIF4E/MNK signaling, eIF4F assembly and mTORC1 were not well separated.","find":"Sorafenib rapidly and progressively reduced global translation and polysomes. The mechanism involved PERK-dependent eIF2α phosphorylation, reduced ERK1/2–MNK1 signaling and eIF4E phosphorylation, altered eIF4F-complex assembly, and changes in mTORC1-linked RPS6/4EBP1 signaling. Translation reprogramming reduced production of oncogenic proteins including Cyclin D1 and c-Myc, and eIF4E rescue experiments linked eIF4E phosphorylation to part of the phenotype.","use":["This is a strong pathway-dissection template for anticancer drugs that inhibit translation but may differ in SG induction.","Directly reusable readouts include puromycin incorporation, p-eIF2α/total eIF2α, p-4EBP1, p-RPS6, p-eIF4E, p-ERK1/2 and polysome profiling.","A useful control logic is to distinguish ISR-dependent initiation inhibition from mTOR/eIF4F-dependent inhibition rather than interpreting all translation loss through p-eIF2α alone."],"idea":"For two SG-inducing drugs and one SG-negative translation inhibitor, measure puromycin incorporation, p-eIF2α, p-4EBP1, p-RPS6 and p-eIF4E at 0.5, 1 and 4 h. Cluster the drugs by pathway signature and ask whether SG formation correlates with one initiation-control route rather than with the absolute degree of translation inhibition."},
{"id":"pmid-42438948","date":"2026-08-29","journal":"Autophagy · 2026","title":"Genome-wide CRISPR-Cas9-based screening revealed the role of ubiquitin ligase TRIM25 in ribosome degradation via ribophagy","score":"9.0/10","topics":["ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/42438948/","q":"Which factors control selective degradation of ribosomes by ribophagy, and can a specific ubiquitin ligase mark ribosomes for this pathway?","gap":"Ribophagy is an established form of selective autophagy, but the upstream machinery that recognizes and ubiquitinates mammalian ribosomes for degradation remains incompletely defined.","find":"A genome-wide CRISPR-Cas9 screen using an RPL29-mCherry-GFP ribophagy reporter identified TRIM25 as a ribophagy regulator. TRIM25 associated with ribosomes during ribophagy induction and promoted ubiquitination linked to whole-ribosome degradation. Poly(I:C), a mimic of viral dsRNA stress, also activated ribophagy in a TRIM25-dependent manner, connecting ribosome turnover to cellular stress defense.","use":["This broadens the ribosome-stress framework beyond collision resolution: prolonged or severe stress may alter ribosome abundance through selective degradation.","The tandem RPL29-mCherry-GFP reporter is a useful imaging concept for following delivery of ribosomes into acidic autolysosomal compartments.","TRIM25, LC3/autophagy perturbation and ribosomal-protein abundance could be useful follow-up readouts when drug treatments produce prolonged translation arrest or apparent loss of ribosomal signal."],"idea":"For one drug that produces persistent translation inhibition over several hours, compare early and late RPL7/RPL29 abundance and localization with LC3 or lysosomal markers. If ribosomal signal falls at late time points, test whether autophagy inhibition preserves it; this would distinguish redistribution into SGs from actual ribosome turnover."},
{"id":"pmid-41656003","date":"2026-08-28","journal":"RNA · 2026","title":"Tuning tRNA synthetase inhibition reveals parabolic induction of stress granules limited in size and RNA content","score":"10/10","topics":["stress-granules","ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41656003/","q":"How does partial, rather than complete, inhibition of translation elongation determine whether stress granules form?","gap":"Strong elongation blockade can trap mRNAs on ribosomes and suppress SG assembly, but it was unclear what happens across intermediate levels of elongation inhibition and why SG induction is not simply proportional to stress intensity.","find":"Intermediate doses of tRNA-synthetase inhibitors produced a parabolic SG dose-response: enough stress activated GCN2 and the ISR, but increasing ribosome occupancy on mRNA limited SG number, size and RNA content. Halofuginone-induced SGs required G3BP1/2 and GCN2 and contained canonical G3BP1, UBAP2L, PABPC1 and poly(A) RNA. Puromycin changed SG formation by releasing ribosomes, directly linking ribosome occupancy to granule assembly.","use":["This gives a mechanistic explanation for non-monotonic drug dose responses: a higher dose can inhibit translation more strongly yet generate fewer SGs.","The experimental design is directly adaptable: U2OS GFP-G3BP1, p-eIF2α/total eIF2α, nascent-protein labeling, puromycin rescue, GCN2 inhibition, G3BP1/2 knockout, oligo(dT) FISH and SG partition coefficients.","The paper quantifies SG-positive cells, SG number, SG area and partition coefficients, which is a useful template for going beyond a simple SG-positive percentage."],"idea":"For one library drug with a non-linear SG response, repeat a 5–6 point concentration series and measure SG-positive percentage, SG area/number, puromycin incorporation and p-eIF2α in parallel. Add puromycin during the final 30 minutes at selected doses."},
{"id":"pmid-41421357","date":"2026-08-28","journal":"Cell · 2026","title":"Nuclear speckle proteins form intrinsic and MALAT1-dependent microphases","score":"9.3/10","topics":["nuclear-speckles"],"url":"https://pubmed.ncbi.nlm.nih.gov/41421357/","q":"What physical organization principles generate nuclear speckles, and how does MALAT1 alter the nanoscale assembly of speckle proteins?","gap":"The internal physical organization of nuclear speckles and the role of MALAT1 were not resolved.","find":"SRSF proteins and TDP-43 form ordered, size-limited microphases that can cluster into larger assemblies. MALAT1 interacts selectively with these assemblies and can stabilize or destabilize distinct microphases.","use":["Morphology changes may reflect internal microphase reorganization rather than simple whole-speckle growth.","Useful markers include SRSF1, SON and MALAT1 RNA-FISH.","Quantify speckle number, area, intensity heterogeneity and RNA partitioning."],"idea":"Pair SON or SRSF1 IF with MALAT1 RNA-FISH after a speckle-altering drug and quantify morphology plus RNA partition coefficient."},
{"id":"pmid-41583565","date":"2026-08-27","journal":"iScience · 2026","title":"Chronic stress antagonizes formation of stress granules","score":"9.8/10","topics":["stress-granules","ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/41583565/","q":"How does chronic low-level stress alter SG competence during a later acute stress?","gap":"Cells in prolonged stress may not respond like acutely stressed cells.","find":"Chronic stress can strongly inhibit protein synthesis while preventing efficient polysome disassembly and later SG assembly; increased eEF2 phosphorylation and elongation slowing contribute.","use":["Useful when translation inhibition and SG abundance disagree.","Measure phospho-eEF2, puromycin incorporation and SG competence across exposure times.","Separate persistent stalls from canonical collision signatures."],"idea":"Compare acute versus prolonged exposure to an SG-weak translation inhibitor, then challenge with arsenite and quantify SG rescue or suppression."},
{"id":"pmid-41535071","date":"2026-08-27","journal":"Genes & Development · 2026","title":"tRNA synthetase activity is required for stress granule and P-body assembly","score":"10/10","topics":["stress-granules","ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/41535071/","q":"Why can strong ISR activation occur without SG or P-body assembly during elongation stress?","gap":"p-eIF2α and initiation suppression do not explain all SG-negative states.","find":"tRNA-synthetase inhibition creates persistent ribosome stalls that keep mRNAs ribosome-bound and suppress SG/P-body formation; puromycin release can restore granules.","use":["A mechanistic model for p-eIF2α-positive but SG-negative drugs.","Useful tools include ZNF598, eS10 ubiquitination, polysome/disome analysis and puromycin rescue.","Halofuginone, arsenite and thapsigargin form a strong control set."],"idea":"Add a short puromycin-release condition to an eIF2α-positive, SG-negative drug and test whether G3BP1 granules are rescued."},
{"id":"pmid-42214329","date":"2026-08-26","journal":"Molecular Cell · 2026","title":"Mechanism of RACK1-dependent ZAKα activation at stalled and collided ribosomes","score":"9.7/10","topics":["ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/42214329/","q":"How does ZAKα recognize impaired ribosome processivity?","gap":"It was unclear whether ZAKα is a collision-only sensor or can respond to single stalls.","find":"ZAKα contacts RACK1, RPS27, 18S rRNA and emerging mRNA; prolonged binding at impaired ribosomes permits activation, and collisions strengthen but are not absolutely required for the response.","use":["Do not equate ZAK activation exclusively with collisions.","Useful readouts include ZAKα and phospho-p38/JNK.","Structure-guided and ribosome-associated assays distinguish processivity defects from global translation loss."],"idea":"Compare ZAK/p38 activation across drugs with matched translation inhibition but different SG phenotypes."},
{"id":"pmid-41912913","date":"2026-08-26","journal":"Leukemia · 2026","title":"BCR::ABL1 tyrosine kinase inhibitors induce ribosome collisions to activate ZAK-dependent ribotoxic stress and apoptosis in chronic myeloid leukemia","score":"9.5/10","topics":["ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41912913/","q":"Can targeted anticancer therapy kill cells by generating ribosome collisions and ribotoxic stress?","gap":"The therapeutic contribution of collision-driven ZAK signaling was not clear.","find":"BCR::ABL1 inhibition increased EEF2 phosphorylation, slowed elongation, generated collided ribosomes and activated ZAK-dependent p38 signaling and apoptosis.","use":["Separate initiation inhibition from elongation slowing.","Useful readouts include phospho-EEF2, ZAK/p38, polysome/MNase-resistant ribosomes and apoptosis.","Changing translation flux provides a causal control strategy."],"idea":"Test whether early p-EEF2 and p-p38 predict later death better than SG abundance in two drug conditions."},
{"id":"pmid-41747727","date":"2026-08-25","journal":"Cell · 2026","title":"Nuclear speckles enable processing of RNA from GC-rich isochores","score":"9.2/10","topics":["nuclear-speckles"],"url":"https://pubmed.ncbi.nlm.nih.gov/41747727/","q":"Which transcripts functionally depend on nuclear speckles?","gap":"Speckle morphology was known, but its direct functional requirement in RNA processing was difficult to isolate.","find":"Acute SON/SRRM2 removal disrupted speckles and selectively impaired processing of GC-rich genes, with extensive exon skipping and intron retention.","use":["SON and SRRM2 are strong structural markers.","Combine IF with RNA processing readouts.","RNA-FISH and splicing analysis help distinguish morphology from function."],"idea":"Pair drug-induced SON/SRRM2 morphology changes with one defined RNA-processing readout."},
{"id":"pmid-41551405","date":"2026-08-25","journal":"NAR Cancer · 2026","title":"Ribosome biogenesis is increased in hepatocellular carcinoma and represents a potential therapeutic target","score":"8.8/10","topics":["ribosome","ribosome-biogenesis","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41551405/","q":"Does increased ribosome biogenesis create a measurable therapeutic vulnerability in cancer?","gap":"It was unclear which nucleolar features predict sensitivity to ribosome-biogenesis targeting.","find":"HCC showed increased Treacle, UBF, Fibrillarin and rRNA production and enhanced sensitivity to nucleolar-targeting compounds.","use":["Useful markers: TCOF1/Treacle, UBF and Fibrillarin.","Quantify nucleolar intensity, number, size and total area.","Compare tumour and normal-cell selectivity."],"idea":"Add Fibrillarin or UBF to NPM1 imaging and correlate nucleolar disruption with SG induction and translation inhibition."},
{"id":"pmid-42524886","date":"2026-08-24","journal":"Journal of Cell Biology · 2026","title":"PARP1 hyperactivity stalls translation and triggers stress granule formation following DNA damage","score":"9.8/10","topics":["stress-granules","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/42524886/","q":"How does DNA damage communicate with cytoplasmic translation to trigger SGs?","gap":"The pathway linking nuclear damage to translation arrest was unclear.","find":"PARP1 hyperactivity depletes NAD+/ATP, activates AMPK, suppresses mTORC1/4EBP1, inhibits translation and promotes SG assembly; G3BP1/2-deficient cells are less viable after genotoxic stress.","use":["Measure p-eIF2α together with mTORC1/4EBP1.","Use SG-defective cells to test causality for survival.","Metabolic rescue can establish pathway order."],"idea":"Combine live SG-onset/death tracking with p-eIF2α and 4EBP1 measurements at matched time points."},
{"id":"pmid-41042876","date":"2026-08-23","journal":"Science Advances · 2025","title":"Translation landscape of stress granules","score":"10/10","topics":["stress-granules","ribosome","translation","cryo-clem"],"url":"https://pubmed.ncbi.nlm.nih.gov/41042876/","q":"Which ribosomal and translation-related complexes are actually present inside stress granules in intact cells?","gap":"Fluorescence enrichment of ribosomal proteins cannot reveal the structural state of ribosomes inside SGs.","find":"Cryogenic correlative imaging and electron tomography directly examined translation-related complexes in SG regions and supported selective partitioning rather than simple sequestration of all ribosomes.","use":["A direct methodological reference for SG cryo-CLEM/cryo-ET.","Compare SG regions with nearby cytoplasm under the same condition.","Distinguish protein fluorescence from 40S, 60S and 80S particle states."],"idea":"Use IF to select a drug with strong RPL7 enrichment, compare 40S and 60S markers against arsenite, then prioritize that condition for cryo-ET."}
];
const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';
function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section class="day"><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}
function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><span class="score">Relevance: ${p.score}</span><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div><div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${p.use.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});render();
</script></body></html>
