<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhD Daily Papers</title><style>body{font-family:Arial,sans-serif;background:#f6f8fc;color:#182033;margin:0}.wrap{max-width:1050px;margin:auto;padding:30px 20px 60px}.views,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid #e4e8f0;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:#182033;color:#fff}.paper{background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:22px;margin:14px 0}.meta{color:#6c7689;font-size:14px}.paper h3{font-size:23px}.section{border-top:1px solid #e4e8f0;padding-top:12px;margin-top:12px}.section b{display:block;font-size:12px;text-transform:uppercase;color:#6c7689}.actions{display:flex;gap:15px;flex-wrap:wrap;margin:16px 0;padding:12px;background:#fafbfe;border-radius:12px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:#eef1ff;border-radius:999px;padding:5px 8px;font-size:12px}.empty{padding:28px;text-align:center;border:1px dashed #e4e8f0;border-radius:14px;color:#6c7689}</style></head><body><div class="wrap"><h1>🔬 PhD Daily Papers</h1><div id="todayLabel"></div><div class="views"><button class="btn active" data-view="today">Today</button><button class="btn" data-view="archive">Archive</button><button class="btn" data-view="publication">⭐ Useful for publication</button><button class="btn" data-view="unread">Unread</button></div><div class="filters"><button class="btn active" data-topic="all">All topics</button><button class="btn" data-topic="stress-granules">Stress granules</button><button class="btn" data-topic="ribosome">Ribosome</button><button class="btn" data-topic="translation">Translation</button><button class="btn" data-topic="ribosome-biogenesis">Ribosome biogenesis</button><button class="btn" data-topic="nuclear-speckles">Nuclear speckles</button><button class="btn" data-topic="drug">Drug mechanisms</button><button class="btn" data-topic="cryo-clem">Cryo-CLEM</button></div><div id="paperRoot"></div></div><script>
const NEW_PAPERS=[{"id":"pmid-41656003","date":"2026-09-21","journal":"RNA · 2026 · Baymiller et al.","title":"Tuning tRNA synthetase inhibition reveals parabolic induction of stress granules limited in size and RNA content","score":"10/10","topics":["stress-granules","ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41656003/","q":"How does partial inhibition of tRNA charging shape stress-granule assembly and composition?","gap":"The relationship between translation-elongation stress, persistent ribosome stalls and stress-granule assembly was not well defined across inhibitor dose.","find":"Intermediate halofuginone or borrelidin doses induced GCN2- and G3BP1/2-dependent stress granules in a non-monotonic pattern. Higher doses trapped mRNAs on ribosomes and limited SG size, number and RNA content. Puromycin restored SG assembly, supporting persistent elongation stalls as the limiting step for mRNA runoff.","use":["Direct match for your non-canonical SG project: similar translation suppression can yield different SG outputs depending on mRNA release from ribosomes.","Plot SG-positive fraction, SG number/cell, SG area and RPL7 partition coefficient across a dose series.","Use puromycin rescue, SUnSET/OP-puro, p-eIF2α and p-GCN2 as orthogonal readouts.","Borrow smFISH plus SG-mask analysis for transcript-selective recruitment."],"idea":"In G3BP1-GFP U2OS, titrate a tRNA-synthetase or ribosome-targeting hit across 8–10 concentrations ± a short puromycin pulse. Quantify SG+ fraction, SG size/number, RPL7 partition coefficient, p-eIF2α/p-GCN2 and SUnSET."},{"id":"pmid-40360199","date":"2026-09-21","journal":"Genes & Development · 2025 · Helton et al.","title":"Ribosome association inhibits stress-induced gene mRNA localization to stress granules","score":"9.8/10","topics":["stress-granules","ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/40360199/","q":"How does ribosome occupancy control whether stress-induced mRNAs enter stress granules?","gap":"The direct contribution of ribosome association and uORF translation to stress-induced mRNA localization was unclear.","find":"Reducing ribosome association increased localization of stress-induced mRNAs to SGs, while increasing ribosome association inhibited localization. uORF reporters were less likely to enter SGs, and a single initiating ribosome could block SG association.","use":["Ribosome occupancy may explain distinct RNA cargo in MIT versus arsenite SGs.","Use smFISH or reporters with G3BP1/UBAP2L and RPL7; quantify transcript-in-SG fraction.","Compare puromycin, cycloheximide and harringtonine to separate ribosome occupancy from translation-rate reduction.","Start with ATF4, GADD34 and one housekeeping mRNA."],"idea":"Compare MIT and arsenite in U2OS using smFISH for ATF4/GADD34 plus G3BP1/RPL7 IF, with cycloheximide, harringtonine and puromycin. Measure transcript-in-SG fraction, RPL7 partition coefficient and SUnSET."},{"id":"pmid-41451945","date":"2026-09-20","journal":"FEBS Journal · 2026 · Huang et al.","title":"Crosstalk between the ribosome quality control-associated E3 ubiquitin ligases LTN1 and RNF10","score":"9.5/10","topics":["ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41451945/","q":"How do the RQC E3 ligases LTN1 and RNF10 cooperate or compensate during stalled-translation quality control?","gap":"How additional E3 ligases integrate with LTN1 remained unclear.","find":"The study identifies functional crosstalk between LTN1 and RNF10 during RQC, supporting a distributed E3 network.","use":["Expand collision/RQC measurements beyond ZNF598 and LTN1.","Pair RNF10/LTN1 with RPL7 and G3BP1 IF.","Use anisomycin or harringtonine and puromycin as controls."],"idea":"Compare MIT, anisomycin and arsenite ± RNF10 or LTN1 depletion; quantify SGs, RPL7 partition, Ub-eS10 and recovery."},{"id":"pmid-41928510","date":"2026-09-20","journal":"Molecular Cell · 2026 · Zhao et al.","title":"2'-O-Methylation maintains ribosome structural and translation integrity","score":"9/10","topics":["ribosome","translation","ribosome-biogenesis"],"url":"https://pubmed.ncbi.nlm.nih.gov/41928510/","q":"How does rRNA 2'-O-methylation preserve ribosome structure and fidelity?","gap":"Functional consequences of rRNA modification loss for stress phenotypes are less directly connected than abundance measurements.","find":"Perturbing 2'-O-methylation compromises ribosome architecture and translation, linking rRNA modification state to mature ribosome quality.","use":["Useful explanation for distinct SG phenotypes despite similar global translation suppression.","Combine RPS6/RPL7 IF, polysome or disome-sensitive readouts, and NPM1/fibrillarin/pre-rRNA markers.","Use cycloheximide, puromycin and anisomycin/harringtonine controls."],"idea":"Compare a ribosome-targeting hit with anisomycin using G3BP1, RPL7 and NPM1 IF plus SUnSET and recovery after washout."},{"id":"pmid-42524886","date":"2026-09-19","journal":"Journal of Cell Biology · 2026 · Tereshchenko et al.","title":"PARP1 hyperactivity stalls translation and triggers stress granule formation following DNA damage","score":"10/10","topics":["stress-granules","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/42524886/","q":"How is DNA damage transmitted to the cytoplasm to inhibit translation and trigger SGs?","gap":"The signaling chain connecting nuclear DNA damage to cytoplasmic translational shutdown was unclear.","find":"PARP1 activation depletes NAD+ and ATP, activates AMPK, inhibits mTORC1 and drives 4E-BP1 hypophosphorylation, enabling G3BP-dependent SG formation.","use":["Useful comparator for MIT because MIT is DNA-damaging yet your MIT SGs are ribosome-enriched and mTOR-independent.","Measure PARP1/PAR, p-AMPK, p-Raptor, p-S6 or p-4E-BP1 and nascent translation.","Include NAD+ rescue or PARP inhibition."],"idea":"Compare MIT with MMS ± PARP inhibitor or NAD+ precursor while measuring G3BP1 SGs, RPL7 partition coefficient, puromycin incorporation, p-AMPK and 4E-BP1."}];
let PAPERS=[...NEW_PAPERS];const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}function esc(s){return String(s).replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div><div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${p.use.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});render();</script></body></html>
