<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhD Daily Papers</title>
<style>:root{--bg:#f6f8fc;--card:#fff;--text:#182033;--muted:#6c7689;--line:#e4e8f0;--accent:#405cf5;--soft:#eef1ff;--gold:#fff4cf}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:34px 20px 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{font-size:36px;margin:0 0 6px}.muted{color:var(--muted)}.views,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}.filters{margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:var(--text);color:#fff}.day{margin-top:30px}.day h2{font-size:18px;margin:0 0 12px;color:var(--muted)}.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 7px 24px rgba(26,36,58,.05)}.meta{font-size:14px;color:var(--muted)}.paper h3{font-size:24px;line-height:1.3;margin:7px 0 10px}.score{display:inline-block;background:#edf8ef;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.section{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.section b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}.section p,.section li{line-height:1.55}.actions{display:flex;gap:15px;flex-wrap:wrap;margin:17px 0 13px;padding:12px;background:#fafbfe;border-radius:12px}.actions label{font-weight:700;font-size:14px}.actions input{width:17px;height:17px;vertical-align:-3px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.paper a{color:var(--accent);font-weight:800;text-decoration:none}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);margin-top:25px}.saved{background:var(--gold)}@media(max-width:650px){.top h1{font-size:30px}.paper{padding:18px}.paper h3{font-size:20px}}</style></head>
<body><div class="wrap"><div class="top"><div><h1>🔬 PhD Daily Papers</h1><div class="muted">1–2 papers a day, summarized for your research.</div></div><div class="muted" id="todayLabel"></div></div><div class="views"><button class="btn active" data-view="today">Today</button><button class="btn" data-view="archive">Archive</button><button class="btn" data-view="publication">⭐ Useful for publication</button><button class="btn" data-view="unread">Unread</button></div><div class="filters"><button class="btn active" data-topic="all">All topics</button><button class="btn" data-topic="stress-granules">Stress granules</button><button class="btn" data-topic="ribosome">Ribosome</button><button class="btn" data-topic="translation">Translation</button><button class="btn" data-topic="ribosome-biogenesis">Ribosome biogenesis</button><button class="btn" data-topic="nuclear-speckles">Nuclear speckles</button><button class="btn" data-topic="drug">Drug mechanisms</button><button class="btn" data-topic="cryo-clem">Cryo-CLEM</button></div><div id="paperRoot"></div></div>
<script>
const NEW_PAPERS=[
{"id":"pmid-42626889","date":"2026-09-15","journal":"Journal of Cell Science · 2026 · Adachi et al.","title":"Chronic stress disrupts the network among stress granules, P-bodies, and motor proteins","score":"10/10","topics":["stress-granules","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/42626889/","q":"How does prior or chronic stress alter the maturation of newly formed stress granules after the initial translation-dependent nucleation step?","gap":"Most SG studies use one acute stress and focus on granule formation or dissolution. Much less was known about whether cellular stress history changes later SG maturation, SG–P-body interactions, and the cytoskeletal machinery that organizes these condensates independently of translation shutdown.","find":"Chronic stress preconditioning reduces SG size and maturation by disrupting an MYH9-dependent interaction network around G3BP1. It also impairs docking between stress granules and P-bodies. In parallel, chronic stress lowers UBAP2L abundance, further weakening SG–P-body docking. The authors therefore separate an early translation-dependent effect of chronic stress from a later translation-independent maturation defect involving the MYH9–G3BP1–UBAP2L axis.","use":["This is directly relevant to your Incucyte observation that MIT-induced SGs appear, change size and can disappear over several hours: SG number alone does not distinguish nucleation from maturation failure.","Add UBAP2L as a second SG marker and DDX6 or another P-body marker to selected MIT/arsenite time points. Quantify SG size, SG number, P-body number and nearest SG–P-body distance/contact frequency.","MYH9 provides a cytoskeletal/mechanical axis that can be tested separately from ISR/mTOR. This is useful for compounds that alter SG morphology without proportional changes in p-eIF2α or global translation.","A useful analysis concept is to classify cells by SG stage: nascent small G3BP1 puncta, mature larger SGs, and SG–P-body-associated structures, rather than treating SG status as only binary.","For controls, compare acute arsenite with a preconditioned/repeated-stress condition and measure UBAP2L protein abundance so reduced SG maturation is not mistaken for weaker initial translation arrest."],"idea":"In U2OS G3BP1-GFP cells, compare arsenite and MIT at an early SG-onset time and a later 4–6 h time point. Co-stain UBAP2L, MYH9 and a P-body marker such as DDX6. For each cell quantify G3BP1 SG number/area, UBAP2L partitioning and SG–P-body nearest-neighbour distance. Pair this with puromycin incorporation. If late MIT SG remodeling occurs while translation remains similarly suppressed, but UBAP2L recruitment or SG–P-body docking changes, it would support a maturation mechanism distinct from translation shutdown."},
{"id":"pmid-41419572","date":"2026-09-15","journal":"Nature Cell Biology · 2026 · Smith & Bartel","title":"The G3BP stress-granule proteins reinforce the integrated stress response translation programme","score":"10/10","topics":["stress-granules","translation","ribosome"],"url":"https://pubmed.ncbi.nlm.nih.gov/41419572/","q":"Are G3BP proteins and stress granules merely consequences of translation shutdown, or do they actively reshape which mRNAs continue to be translated during stress?","gap":"Stress granule formation and global translation repression occur together, making causality difficult to establish. It was unclear whether SGs actively influence the ISR translation program and whether SG-enriched transcripts are simply stored or preferentially supported for translation.","find":"Using acute G3BP1/2 depletion, spike-normalized ribosome profiling, SG RNA measurements and optogenetic G3BP condensates, the study shows that G3BPs and SGs actively reinforce the stress translation program. SGs are enriched for transcripts relatively resistant to stress-induced translation shutdown; G3BPs help favor translation of these SG-enriched mRNAs while further suppressing bulk cytosolic translation. Artificial G3BP condensates are sufficient to reproduce part of this translation phenotype, and tethering reporter RNAs to SG-associated G3BP/CAPRIN1 can increase their relative translation during stress.","use":["This changes the interpretation of your SG–cell-fate analysis: SG-positive cells may not simply have stronger translation inhibition. SG formation itself can reshape selective translation while bulk protein synthesis remains low.","The paper's spike-normalized ribosome profiling is a strong future method because ordinary relative ribosome profiling can hide global translation collapse. For a simpler screen-level readout, pair SUnSET/OPP with candidate stress-response proteins whose translation persists during stress.","G3BP1/2 depletion provides the clean causal control: compare the same drug with and without SG competence rather than correlating naturally SG+ and SG− cells only.","Useful imaging/RNA tools include PABPC1 as an additional SG marker, smFISH for selected SG-enriched transcripts, G3BP/CAPRIN1 perturbation and time-resolved polysome or translation measurements.","For your non-canonical MIT SGs, a key question becomes whether ribosome-enriched SGs produce the same translation-reprogramming effect as canonical arsenite SGs. A difference would strengthen the argument that MIT creates a functionally distinct SG state."],"idea":"Compare MIT and arsenite in parental versus G3BP1/2-deficient or strongly depleted cells. Measure bulk translation by puromycin/OPP and, in parallel, quantify a small panel of ISR-responsive proteins or reporter transcripts over time. If removing G3BPs changes selective protein output or later survival under arsenite but produces a different effect under MIT, this would directly test whether your ribosome-enriched MIT granules have a distinct functional relationship with translation and cell fate."}
];
let PAPERS=[...NEW_PAPERS];const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section class="day"><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}
function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><span class="score">Relevance: ${p.score}</span><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div><div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${p.use.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
async function loadArchive(){try{const sources=[['https://raw.githubusercontent.com/zoey501/phd-daily-papers/70256912e0c2dc35d6539e42aea115f7e282d9c6/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/acdd755ab6b8976fd6848b1dea14f3719166c09e/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/e8246c10370642da882309143c142f34b2959a26/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/55c7542f8f1a8c14ffbabd5185e3600b35e21355/index.html','PAPERS']];let old=[];for(const [url,name] of sources){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('archive fetch failed');const t=await r.text();const re=new RegExp('const '+name+'=\\[([\\s\\S]*?)\\];');const m=t.match(re);if(!m)throw new Error('archive parse failed');old.push(...JSON.parse('['+m[1]+']'))}const seen=new Set(NEW_PAPERS.map(p=>p.id));PAPERS=[...NEW_PAPERS,...old.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return true})]}catch(e){console.error(e)}render()}render();loadArchive();
</script></body></html>
