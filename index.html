<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhD Daily Papers</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#182033;--muted:#6c7689;--line:#e4e8f0;--accent:#405cf5;--soft:#eef1ff;--gold:#fff4cf}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1050px;margin:auto;padding:34px 20px 70px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end;flex-wrap:wrap}.top h1{font-size:36px;margin:0 0 6px}.muted{color:var(--muted)}.views,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 0}.filters{margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:var(--text);color:#fff}.day{margin-top:30px}.day h2{font-size:18px;margin:0 0 12px;color:var(--muted)}.paper{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 7px 24px rgba(26,36,58,.05)}.meta{font-size:14px;color:var(--muted)}.paper h3{font-size:24px;line-height:1.3;margin:7px 0 10px}.score{display:inline-block;background:#edf8ef;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.section{border-top:1px solid var(--line);padding-top:13px;margin-top:14px}.section b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}.section p,.section li{line-height:1.55}.actions{display:flex;gap:15px;flex-wrap:wrap;margin:17px 0 13px;padding:12px;background:#fafbfe;border-radius:12px}.actions label{font-weight:700;font-size:14px}.actions input{width:17px;height:17px;vertical-align:-3px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:var(--soft);border-radius:999px;padding:5px 8px;font-size:12px}.paper a{color:var(--accent);font-weight:800;text-decoration:none}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);margin-top:25px}.saved{background:var(--gold)}@media(max-width:650px){.top h1{font-size:30px}.paper{padding:18px}.paper h3{font-size:20px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>🔬 PhD Daily Papers</h1><div class="muted">1–2 papers a day, summarized for your research.</div></div><div class="muted" id="todayLabel"></div></div>
<div class="views"><button class="btn active" data-view="today">Today</button><button class="btn" data-view="archive">Archive</button><button class="btn" data-view="publication">⭐ Useful for publication</button><button class="btn" data-view="unread">Unread</button></div>
<div class="filters"><button class="btn active" data-topic="all">All topics</button><button class="btn" data-topic="stress-granules">Stress granules</button><button class="btn" data-topic="ribosome">Ribosome</button><button class="btn" data-topic="translation">Translation</button><button class="btn" data-topic="ribosome-biogenesis">Ribosome biogenesis</button><button class="btn" data-topic="nuclear-speckles">Nuclear speckles</button><button class="btn" data-topic="drug">Drug mechanisms</button><button class="btn" data-topic="cryo-clem">Cryo-CLEM</button></div>
<div id="paperRoot"></div></div>
<script>
const NEW_PAPERS=[
{"id":"pmid-42636110","date":"2026-09-13","journal":"Cell Reports · 2026 · Macedo de Vasconcelos, Ripin & Parker","title":"Zinc increases stress granule formation by promoting RNA condensation","score":"10/10","topics":["stress-granules","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/42636110/","q":"Can the intracellular ionic environment directly tune stress-granule condensation independently of the degree of translational repression?","gap":"Stress-granule assembly is usually discussed as a consequence of translation shutdown and increased non-translating mRNA, but it remained unclear whether physiologic changes in divalent ions can directly alter RNA-RNA condensation and thereby change SG formation or persistence without changing protein-synthesis inhibition.","find":"Oxidative stress increases labile intracellular zinc and induces zinc-sequestering metallothioneins. Raising intracellular zinc increases SG formation and delays SG disassembly without increasing translational repression, whereas zinc depletion reduces SG formation. Mechanistically, Zn2+ directly stimulates RNA condensation at concentrations roughly 100-fold lower than Mg2+. Zinc also promotes RNA-G3BP1 co-condensation and more interconnected RNA assemblies, supporting a model in which metal-ion-dependent RNA interactions directly tune SG assembly independently of the canonical translation-initiation pathway.","use":["This is highly relevant to your non-canonical SG project because it is a clean demonstration that stronger or more persistent G3BP1 granules do not necessarily mean stronger translation inhibition. SG condensation and translation can be experimentally uncoupled.","Useful perturbations include ZnCl2 to increase labile zinc, the zinc-selective chelator TPA to lower it, metallothionein manipulation such as MT1X overexpression, and MTF1 depletion to alter endogenous zinc buffering.","For imaging, quantify SG-positive-cell fraction, SG number, total SG area and disassembly kinetics after stress washout. Pair these metrics with a direct translation readout such as puromycin/SUnSET so granule behavior is not inferred from translation alone.","The paper also provides a useful mechanistic control: TIA1 depletion does not abolish the zinc effect, arguing that zinc acts through RNA condensation rather than simply increasing aggregation of one SG protein.","For your MIT system, this suggests measuring ionic/metal-dependent effects when SGs persist despite unusual translational signaling. Zinc chelation is a simple way to test whether part of the persistence reflects strengthened RNA condensation rather than continued upstream ISR or mTOR signaling."],"idea":"Treat U2OS G3BP1-GFP cells with MIT and arsenite with or without a zinc chelator such as TPA, then follow SG formation and disappearance by live imaging while measuring puromycin incorporation in matched wells. If chelation shortens MIT-SG persistence or reduces SG area without proportionally restoring translation, that would support a condensation-level mechanism downstream of translation control. A ZnCl2 add-back condition would provide a rescue control."},
{"id":"pmid-42062483","date":"2026-09-13","journal":"Nature Cell Biology · 2026 · Douglas et al.","title":"The atypical E3 ligase HOIL-1 safeguards the ribosome during cellular stress","score":"9.9/10","topics":["ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/42062483/","q":"How does the ribosome decide whether metabolic or translational stress is resolved adaptively or converted into ribotoxic-stress signaling and cell death?","gap":"Ribosomes are recognized as stress-signaling hubs, but the ubiquitin machinery that protects stressed ribosomes and determines whether ribosome collisions progress into ZAKα-dependent signaling and cell death was incompletely defined.","find":"The authors identify HOIL-1 as a protective component of the ribosome stress network. HOIL-1 promotes ribosome ubiquitination and cytoprotective ribosome-associated quality control, limiting ribosome collisions during nutrient and translational stress. HOIL-1 loss makes glucose starvation ribotoxic, activates the collision sensor kinase ZAKα and ATF4, and promotes xCT-dependent disulfidptosis. The study therefore connects ribosome ubiquitination, collision/RQC, integrated stress signaling and cell fate in one pathway.","use":["This gives your drug screen a useful framework for separating simple translation inhibition from true ribotoxic stress: two drugs can suppress protein synthesis similarly but differ in collision burden, ZAKα activation and downstream cell fate.","Useful biochemical markers include ribosomal ubiquitination, ZAKα activation/phosphorylation and ATF4. The paper uses Phos-tag analysis for ZAKα and ubiquitin-proteomics to map the stress-dependent ribosomal ubiquitin landscape.","Anisomycin is used as a ribotoxic-stress comparator, while nutrient starvation provides a physiologic stress control. ZAK knockdown is a strong genetic control for proving that a phenotype is collision/ribotoxic-stress dependent rather than a generic stress response.","For a practical first-pass assay, combine puromycin incorporation with ZAKα/ATF4 Western blots and one collision/RQC readout. This would let you classify your 60 compounds into translation suppression with low ribotoxic signaling versus translation suppression with strong RSR activation.","The cell-fate arm is also relevant to your live-cell work: the study explicitly links ribosome stress to later death, supporting time-resolved analysis in which early collision/RSR markers are compared with subsequent SG persistence and single-cell survival."],"idea":"Choose MIT, arsenite and one antibiotic-like compound that strongly inhibits translation but gives weak or absent SG formation. Match doses as closely as possible for puromycin suppression, then assay ZAKα phosphorylation, ATF4 and a ribosomal ubiquitination/collision marker at early time points and follow cell death later. Add a ZAKα inhibitor or knockdown condition. If a drug's toxicity falls with ZAKα inhibition while SG behavior is unchanged, that would separate ribotoxic-stress-driven death from SG-dependent effects."}
];
let PAPERS=[...NEW_PAPERS];
const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';
function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section class="day"><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}
function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><span class="score">Relevance: ${p.score}</span><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div><div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${p.use.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});
async function loadArchive(){try{const sources=[['https://raw.githubusercontent.com/zoey501/phd-daily-papers/e8246c10370642da882309143c142f34b2959a26/index.html','NEW_PAPERS'],['https://raw.githubusercontent.com/zoey501/phd-daily-papers/55c7542f8f1a8c14ffbabd5185e3600b35e21355/index.html','PAPERS']];let old=[];for(const [url,name] of sources){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('archive fetch failed');const t=await r.text();const re=new RegExp('const '+name+'=\\[([\\s\\S]*?)\\];');const m=t.match(re);if(!m)throw new Error('archive parse failed');old.push(...JSON.parse('['+m[1]+']'))}const ids=new Set(NEW_PAPERS.map(p=>p.id));const seen=new Set(ids);PAPERS=[...NEW_PAPERS,...old.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return true})]}catch(e){console.error(e)}render()}
render();loadArchive();
</script></body></html>
