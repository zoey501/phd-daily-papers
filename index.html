<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhD Daily Papers</title><style>body{font-family:Arial,sans-serif;background:#f6f8fc;color:#182033;margin:0}.wrap{max-width:1050px;margin:auto;padding:30px 20px 60px}.views,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn{border:1px solid #e4e8f0;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.active{background:#182033;color:#fff}.paper{background:#fff;border:1px solid #e4e8f0;border-radius:18px;padding:22px;margin:14px 0}.meta{color:#6c7689;font-size:14px}.paper h3{font-size:23px;margin-bottom:8px}.section{border-top:1px solid #e4e8f0;padding-top:12px;margin-top:12px}.section b{display:block;font-size:12px;text-transform:uppercase;color:#6c7689}.actions{display:flex;gap:15px;flex-wrap:wrap;margin:16px 0;padding:12px;background:#fafbfe;border-radius:12px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.tag{background:#eef1ff;border-radius:999px;padding:5px 8px;font-size:12px}.empty{padding:28px;text-align:center;border:1px dashed #e4e8f0;border-radius:14px;color:#6c7689}.summary{font-size:15px;color:#475266;margin:8px 0 14px}.details{margin-top:14px;border-top:1px solid #e4e8f0;padding-top:10px}.details summary{cursor:pointer;font-weight:700;color:#26334d}.logic{margin:8px 0 0 18px}.logic li{margin:9px 0;line-height:1.5}.info-grid{display:grid;grid-template-columns:170px 1fr;gap:7px 12px;font-size:14px}.info-grid div:nth-child(odd){font-weight:700;color:#5e687a}.keyfig{margin:8px 0}.pill{display:inline-block;background:#edf7ef;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700;margin-right:6px}.saved{outline:2px solid #f0d879}@media(max-width:700px){.info-grid{grid-template-columns:1fr}.info-grid div:nth-child(odd){margin-top:8px}}</style></head><body><div class="wrap"><h1>🔬 PhD Daily Papers</h1><div id="todayLabel"></div><div class="views"><button class="btn active" data-view="today">Today</button><button class="btn" data-view="archive">Archive</button><button class="btn" data-view="publication">⭐ Useful for publication</button><button class="btn" data-view="unread">Unread</button></div><div class="filters"><button class="btn active" data-topic="all">All topics</button><button class="btn" data-topic="stress-granules">Stress granules</button><button class="btn" data-topic="ribosome">Ribosome</button><button class="btn" data-topic="translation">Translation</button><button class="btn" data-topic="ribosome-biogenesis">Ribosome biogenesis</button><button class="btn" data-topic="nuclear-speckles">Nuclear speckles</button><button class="btn" data-topic="drug">Drug mechanisms</button><button class="btn" data-topic="cryo-clem">Cryo-CLEM</button></div><div id="paperRoot"></div></div><script>
const NEW_PAPERS=[
{"id":"doi-10.1038-s41589-026-02316-9","date":"2026-09-28","journal":"Nature Chemical Biology · 2026","title":"SRSF1 modulates the dark nucleolar cap pH to restore nucleolar integrity and function","topics":["ribosome-biogenesis","nuclear-speckles"],"url":"https://doi.org/10.1038/s41589-026-02316-9","paperType":"Mechanistic cell biology / nucleolar stress","why":"This paper is worth reading because it follows a complete mechanistic chain from stress-induced SRSF1 relocalization, to regulation of dark nucleolar cap chemistry, to recovery of nucleolar structure and function. It is a strong example of how to connect condensate localization with a measurable physicochemical property and then with organelle function.","q":"How does SRSF1 contribute to recovery of nucleolar integrity after stress, and what physicochemical mechanism allows it to act within dark nucleolar caps?","gap":"Dark nucleolar caps form during nucleolar stress, but how their internal physicochemical environment is regulated and how that regulation contributes to restoration of nucleolar function was not well understood.","logic":["Question: Where does SRSF1 go during nucleolar stress? → Experiment: fluorescence imaging of SRSF1 relative to nucleolar-cap markers → Result: SRSF1 accumulates in dark nucleolar caps → Meaning: SRSF1 is actively recruited to the stress-induced nucleolar compartment.","Question: What recruits SRSF1 to the dark nucleolar cap? → Experiment: perturbation of candidate partners including DDX18 → Result: DDX18 is required for efficient SRSF1 accumulation → Meaning: SRSF1 targeting is not passive diffusion but depends on a nucleolar interaction network.","Question: Does SRSF1 change the physical environment of the cap? → Experiment: direct pH measurements inside dark nucleolar caps → Result: SRSF1 modulates local cap pH → Meaning: SRSF1 changes condensate chemistry, not only protein composition.","Question: Is that chemical change functionally important? → Experiment: depletion/mutational analysis followed by nucleolar recovery assays → Result: loss of SRSF1 function impairs restoration of nucleolar integrity and function → Meaning: local pH regulation is linked to recovery.","Question: Which part of SRSF1 performs this function? → Experiment: domain dissection → Result: the arginine/serine-rich RS domain is critical → Meaning: charge-rich sequence features are central to the mechanism.","Question: Is the chemical principle sufficient beyond native SRSF1? → Experiment: artificial arginine-rich peptide rescue → Result: the synthetic charge-rich element partially restores the relevant behavior → Meaning: electrostatic/chemical properties of the RS domain are mechanistically important."],"figs":["Fig. 1 — establishes stress-dependent localization of SRSF1 to dark nucleolar caps.","Fig. 2 — identifies DDX18 dependence for SRSF1 recruitment.","Fig. 3 — directly tests and quantifies dark nucleolar cap pH.","Fig. 4–6 — connect pH control to nucleolar recovery, identify the RS domain, and test rescue with an arginine-rich peptide."],"find":"SRSF1 is recruited to dark nucleolar caps during nucleolar stress, where it helps tune the local chemical environment. Its recruitment depends on DDX18, its RS domain is functionally important, and modulation of cap pH contributes to restoration of nucleolar integrity and function.","conclusions":["SRSF1 is an active regulator of the dark nucleolar cap rather than merely a stress-associated passenger.","Local condensate pH is a biologically regulated property linked to nucleolar recovery.","The charge-rich RS domain of SRSF1 contributes directly to this function.","The work supports a model in which condensate chemistry can be manipulated by specific proteins to restore organelle function."],"info":{"Model / cell system":"Human cultured cells used for nucleolar stress and recovery assays; consult Methods for exact line-by-line conditions.","Primary perturbation":"Nucleolar stress followed by recovery; SRSF1/DDX18 perturbation and domain-mutant analysis.","Key proteins / markers":"SRSF1, DDX18 and dark-nucleolar-cap / nucleolar markers.","Core assays":"Fluorescence imaging, localization/colocalization analysis, pH measurement, depletion/mutational rescue, nucleolar recovery assays.","Key functional variable":"Dark nucleolar cap pH and restoration of nucleolar integrity/function.","Critical control logic":"Compare stressed versus recovering cells; wild-type versus depleted/mutant SRSF1; recruitment-defective conditions; synthetic arginine-rich rescue.","Quantification to notice":"Subcellular enrichment, cap-associated intensity/localization, pH readout, nucleolar morphology/recovery metrics.","Exact doses / timings":"Use the primary paper Methods for exact values; this dashboard does not invent unverified parameters."},"mechanism":"Nucleolar stress → dark nucleolar cap formation → DDX18-dependent SRSF1 recruitment → RS-domain-driven modulation of local cap chemistry/pH → improved restoration of nucleolar organization and function.","strengths":["Strong stepwise mechanistic logic from localization to causal perturbation to physicochemical readout to functional recovery.","Direct measurement of an internal condensate property rather than inferring mechanism only from morphology.","Domain-level and synthetic-peptide experiments strengthen causal interpretation."],"limits":["The generality of this pH-regulation mechanism across different forms of nucleolar stress remains to be established.","Condensate pH is one physicochemical dimension; other factors such as ionic strength, RNA concentration and material properties may also contribute.","Cell-culture mechanisms may not fully capture tissue-level nucleolar stress responses."],"novel":"The genuinely new contribution is the demonstration that SRSF1 can regulate a local physicochemical property—dark nucleolar cap pH—and that this regulation is functionally tied to recovery of nucleolar integrity. The paper moves beyond describing stress-induced relocalization and assigns a chemical role to a specific condensate-associated protein.","relevance":"Short relevance to your work: this is a useful conceptual model for interpreting B23/NPM1 or nuclear-body morphology. A changed condensate shape or localization may reflect an altered chemical microenvironment rather than simply gain/loss of a marker.","idea":"Hypothesis: a drug that strongly alters NPM1 morphology also changes the physicochemical state of the nucleolar compartment. Minimal design: control vs selected drug vs washout/recovery, with NPM1 plus one additional nucleolar marker and a compatible chemical/environmental readout. Readout: nucleolar morphology, marker partitioning and recovery kinetics. Interpretation: if morphology recovers without restoration of the chemical readout, structure and physicochemical function can be uncoupled; if both recover together, the drug phenotype may reflect reversible condensate-state remodeling."},
{"id":"pmid-41656003","date":"2026-09-21","journal":"RNA · 2026 · Baymiller et al.","title":"Tuning tRNA synthetase inhibition reveals parabolic induction of stress granules limited in size and RNA content","topics":["stress-granules","ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41656003/","q":"How does partial inhibition of tRNA charging shape stress-granule assembly and composition?","gap":"The relationship between translation-elongation stress, persistent ribosome stalls and stress-granule assembly was not well defined across inhibitor dose.","find":"Intermediate halofuginone or borrelidin doses induced GCN2- and G3BP1/2-dependent stress granules in a non-monotonic pattern. Higher doses trapped mRNAs on ribosomes and limited SG size, number and RNA content. Puromycin restored SG assembly, supporting persistent elongation stalls as the limiting step for mRNA runoff.","use":["Plot SG-positive fraction, SG number/cell, SG area and RPL7 partition coefficient across a dose series.","Use puromycin rescue, SUnSET/OP-puro, p-eIF2α and p-GCN2 as orthogonal readouts."],"idea":"Titrate a ribosome-targeting hit across concentrations ± a short puromycin pulse and quantify SG and translation readouts."},
{"id":"pmid-40360199","date":"2026-09-21","journal":"Genes & Development · 2025 · Helton et al.","title":"Ribosome association inhibits stress-induced gene mRNA localization to stress granules","topics":["stress-granules","ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/40360199/","q":"How does ribosome occupancy control whether stress-induced mRNAs enter stress granules?","gap":"The contribution of ribosome association and uORF translation to stress-induced mRNA localization was unclear.","find":"Reducing ribosome association increased localization of stress-induced mRNAs to SGs, while increasing ribosome association inhibited localization. A single initiating ribosome could block SG association.","use":["Use smFISH or reporters with G3BP1/UBAP2L and RPL7.","Compare puromycin, cycloheximide and harringtonine."],"idea":"Compare selected transcripts in MIT and arsenite SGs under ribosome-occupancy perturbations."},
{"id":"pmid-41451945","date":"2026-09-20","journal":"FEBS Journal · 2026 · Huang et al.","title":"Crosstalk between the ribosome quality control-associated E3 ubiquitin ligases LTN1 and RNF10","topics":["ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41451945/","q":"How do LTN1 and RNF10 cooperate or compensate during stalled-translation quality control?","gap":"How additional E3 ligases integrate with LTN1 remained unclear.","find":"The study identifies functional crosstalk between LTN1 and RNF10 during RQC, supporting a distributed E3 network.","use":["Expand collision/RQC measurements beyond ZNF598 and LTN1."],"idea":"Compare MIT, anisomycin and arsenite ± RNF10 or LTN1 depletion."},
{"id":"pmid-41928510","date":"2026-09-20","journal":"Molecular Cell · 2026 · Zhao et al.","title":"2'-O-Methylation maintains ribosome structural and translation integrity","topics":["ribosome","translation","ribosome-biogenesis"],"url":"https://pubmed.ncbi.nlm.nih.gov/41928510/","q":"How does rRNA 2'-O-methylation preserve ribosome structure and fidelity?","gap":"Functional consequences of rRNA modification loss were incompletely connected to mature ribosome quality.","find":"Perturbing 2'-O-methylation compromises ribosome architecture and translation.","use":["Combine RPS6/RPL7 IF with polysome or disome-sensitive readouts and nucleolar markers."],"idea":"Compare a ribosome-targeting hit with anisomycin using G3BP1, RPL7 and NPM1 IF plus SUnSET."},
{"id":"pmid-42524886","date":"2026-09-19","journal":"Journal of Cell Biology · 2026 · Tereshchenko et al.","title":"PARP1 hyperactivity stalls translation and triggers stress granule formation following DNA damage","topics":["stress-granules","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/42524886/","q":"How is DNA damage transmitted to the cytoplasm to inhibit translation and trigger SGs?","gap":"The signaling chain connecting nuclear DNA damage to cytoplasmic translational shutdown was unclear.","find":"PARP1 activation depletes NAD+ and ATP, activates AMPK, inhibits mTORC1 and drives 4E-BP1 hypophosphorylation, enabling G3BP-dependent SG formation.","use":["Measure PARP1/PAR, p-AMPK, p-Raptor, p-S6 or p-4E-BP1 and nascent translation."],"idea":"Compare MIT with MMS ± PARP inhibitor or NAD+ precursor while measuring SGs and translation."}
];
let PAPERS=[...NEW_PAPERS];const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}function esc(s){return String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[m]))}function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}
function oldCard(p,f){return `<div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${(p.use||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div>`}
function detailedCard(p){return `<p class="summary"><span class="pill">Detailed report</span>${esc(p.why)}</p><details class="details" open><summary>Read detailed paper report</summary><div class="section"><b>Paper type</b><p>${esc(p.paperType)}</p></div><div class="section"><b>Main scientific question</b><p>${esc(p.q)}</p></div><div class="section"><b>Knowledge gap / problem</b><p>${esc(p.gap)}</p></div><div class="section"><b>Main experimental logic</b><ol class="logic">${p.logic.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="section"><b>Key experiments / main figures</b>${p.figs.map(x=>`<p class="keyfig">${esc(x)}</p>`).join('')}</div><div class="section"><b>Main findings</b><p>${esc(p.find)}</p></div><div class="section"><b>Main conclusions</b><ul>${p.conclusions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Key experimental information extracted</b><div class="info-grid">${Object.entries(p.info).map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join('')}</div></div><div class="section"><b>Mechanistic model</b><p>${esc(p.mechanism)}</p></div><div class="section"><b>Strengths</b><ul>${p.strengths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Limitations</b><ul>${p.limits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>What is genuinely new?</b><p>${esc(p.novel)}</p></div><div class="section"><b>Possible relevance to your work</b><p>${esc(p.relevance)}</p></div><div class="section"><b>One experiment inspired by this paper</b><p>${esc(p.idea)}</p></div></details>`}
function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div>${p.logic?detailedCard(p):oldCard(p,f)}<div class="section"><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></div></article>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});render();</script></body></html>
