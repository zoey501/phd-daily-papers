const PAPERS=[
{"id":"pmid-42297957","date":"2026-09-03","journal":"EMBO Reports · 2026 · Amzallag et al.","title":"The E3 ligase MKRN2 prevents DRiP accumulation in stress granules and maintains granulostasis","score":"10/10","topics":["stress-granules","ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/42297957/","q":"How does ubiquitin-dependent protein quality control prevent defective ribosomal products from accumulating in stress granules and disrupting their normal assembly/disassembly cycle?","gap":"Misfolded defective ribosomal products (DRiPs) can enter stress granules and alter their material properties, but the specific ubiquitin machinery that keeps these products under control and preserves normal SG dynamics was poorly defined.","find":"Using G3BP1-mCherry U2OS cells, APEX proximity proteomics, live-cell SG tracking, FRAP and OP-puromycin labeling, the authors identify MKRN2 as a UBA1-dependent SG-associated E3 ligase. MKRN2 depletion produces smaller, poorly coalescing SGs and delays SG disassembly after heat-stress recovery. Loss of UBA1 activity or MKRN2 increases OP-puromycin-labeled DRiP partitioning into SGs. The work therefore connects ubiquitination, nascent defective translation products and SG material homeostasis, or granulostasis.","use":["This is unusually close to your system because the study uses U2OS cells and G3BP1-based SG imaging, so many imaging concepts are directly transferable.","OP-puromycin can be used not only as a global translation readout but also to label newly generated defective nascent products and quantify their partition coefficient inside SGs.","Useful mechanistic controls include UBA1 inhibition with TAK243, MKRN2 knockdown, heat stress versus arsenite, and recovery after stress removal.","Quantifying SG number, area, coalescence, disassembly kinetics and G3BP1 FRAP reveals phenotypes that a simple SG-positive-cell percentage would miss.","MKRN2, ZNF598, CNOT4, VCP cofactors and HSP70-family proteins form a useful proteostasis panel when a drug produces persistent or unusually protein-rich SGs."],"idea":"Take one drug from your screen that produces persistent or ribosome-enriched SGs and compare it with arsenite. Pulse-label nascent products with OP-puromycin shortly before fixation, then quantify OP-puromycin partition coefficients inside G3BP1-positive SGs during treatment and after washout. Add TAK243 as a positive control for defective granulostasis. If the drug causes high DRiP enrichment and slow SG clearance without proportionally stronger translation shutdown, it would suggest that proteostasis failure contributes to the non-canonical SG phenotype."},
{"id":"pmid-42456652","date":"2026-09-02","journal":"Molecular Cell · 2026 · Dogra et al.","title":"Granular component sub-phases direct ribosome biogenesis in the nucleolus","score":"10/10","topics":["ribosome","ribosome-biogenesis"],"url":"https://pubmed.ncbi.nlm.nih.gov/42456652/","q":"How does the internal spatial organization of the nucleolar granular component help drive ribosomal-subunit assembly and release?","gap":"The nucleolus is known to be multiphase, but the granular component itself contains heterogeneous ribosome-assembly factors. The molecular basis of that heterogeneity and its functional relationship to ribosome-subunit maturation were unclear.","find":"Super-resolution imaging showed that NPM1, SURF6 and rRNA occupy distinct sub-phases within the granular component. Reconstitution experiments produced a SURF6/rRNA-rich core surrounded by an NPM1-rich shell. As ribosomal particles mature, SURF6 binds them less strongly, allowing NPM1 to extract assembled subunits from the condensate. The authors propose an assembly-line-like mechanism in which granular-component microphases organize ribosome assembly and subunit efflux.","use":["This is directly relevant to B23/NPM1 imaging: NPM1 redistribution may report altered granular-component organization rather than only generic nucleolar stress.","Useful imaging markers are NPM1/B23, SURF6 and rRNA; super-resolution colocalization or radial-intensity analysis can reveal core-versus-shell organization that ordinary nucleolar area measurements miss.","Actinomycin D provides a useful rRNA-depletion control for testing how reduced rRNA changes NPM1-SURF6 organization.","The study suggests that drugs perturbing ribosome biogenesis could be classified by whether they disrupt rRNA-rich assembly cores, NPM1-rich outer phases or subunit release."],"idea":"For a drug that strongly changes B23/NPM1 morphology, co-stain NPM1 and SURF6 and add an rRNA readout. Quantify the radial NPM1-versus-SURF6 intensity profile within individual nucleoli and compare with low-dose actinomycin D. A selective change in core-shell organization could indicate a specific defect in late ribosome assembly or subunit release rather than simple Pol I shutdown."},
{"id":"pmid-42603274","date":"2026-09-02","journal":"Cell Reports · 2026 · Chivukula Venkata et al.","title":"Nuclear speckle-associated perispeckle networks partition active chromatin into gene expression niches","score":"9.4/10","topics":["nuclear-speckles"],"url":"https://pubmed.ncbi.nlm.nih.gov/42603274/","q":"Are nuclear speckles the only spatial gene-expression hubs around active chromatin, or do additional speckle-associated compartments organize transcription and RNA handling?","gap":"Some genes increase expression when contacting nuclear speckles, yet genome-wide expression patterns cannot be explained by distance to speckles alone. This suggested that additional nuclear compartments surrounding speckles might contribute to gene regulation.","find":"The authors identified two dynamic multi-protein perispeckle networks extending outward from nuclear speckles. Highly active chromatin regions associate with these structures even when they are not directly contacting speckles. The networks persist after speckles are experimentally eliminated, and genes associated with speckles versus perispeckle networks respond differently to speckle depletion. Intron-containing and intronless transcripts also show different associations with these compartments.","use":["For drug-induced nuclear-speckle phenotypes, this argues against scoring only speckle number or size; changes in the surrounding perispeckle region may also be biologically meaningful.","A useful imaging strategy is to combine a canonical speckle marker such as SON or SRRM2 with one perispeckle-associated protein and quantify spatial distance or radial intensity around each speckle.","RNA-FISH for an intron-containing versus intronless reporter provides a functional readout that can distinguish altered RNA handling from a purely morphological speckle change.","Acute speckle disruption/depletion is a strong mechanistic control for deciding whether a drug phenotype truly depends on nuclear speckles."],"idea":"For one compound that changes SON/SRRM2 morphology, add RNA-FISH for one intron-rich endogenous transcript and quantify transcript distance from speckles together with a perispeckle marker. Compare this with a condition that acutely disrupts speckles. If transcript redistribution extends beyond the speckle boundary, the drug may be remodeling the broader speckle-associated gene-expression niche rather than only the speckle core."},
{"id":"pmid-42575690","date":"2026-09-01","journal":"Genes & Development · 2026 · Fan et al.","title":"mTOR inactivation governs adaptive survival to ribosome biogenesis deficiency","score":"10/10","topics":["ribosome","ribosome-biogenesis","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/42575690/","q":"How do cancer cells survive when ribosome biogenesis is strongly impaired and translational capacity becomes limiting?","gap":"Ribosome-biogenesis inhibition is being explored therapeutically, but the adaptive mechanisms that let stressed or treatment-resistant cells survive with a much smaller translation capacity were poorly defined.","find":"Functional-genomics screening during RNA polymerase I inhibition identified mTOR inactivation as a survival mechanism. mTORC1 inhibition did not restore rRNA synthesis or ribosome biogenesis; instead, it redistributed the limited ribosome pool away from highly translated 5'TOP mRNAs toward transcripts needed for survival. The authors describe this resource-prioritization state as translational fitness.","use":["This is highly relevant when interpreting drugs that perturb the nucleolus or ribosome biogenesis: reduced mTOR activity can be adaptive rather than simply a second toxic hit.","Useful pathway readouts include p-4EBP1 and p-S6 together with rRNA/pre-rRNA measurements and a global translation assay.","A functional-genomics or inhibitor-rescue design can distinguish pathways that cause the primary defect from pathways that help cells tolerate it.","The 5'TOP-versus-survival-transcript redistribution concept suggests that bulk puromycin incorporation alone may miss important selective changes in translation."],"idea":"For a drug that strongly changes NPM1/B23 morphology and suppresses translation, compare drug alone with drug plus an mTORC1 inhibitor. Measure NPM1 morphology, pre-rRNA, puromycin incorporation, p-4EBP1/p-S6 and viability. If mTORC1 inhibition improves survival without restoring ribosome biogenesis, that would indicate an adaptive translational-fitness response rather than recovery of ribosome production."},
{"id":"pmid-42062483","date":"2026-09-01","journal":"Nature Cell Biology · 2026 · Douglas et al.","title":"The atypical E3 ligase HOIL-1 safeguards the ribosome during cellular stress","score":"9.8/10","topics":["ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/42062483/","q":"How does ribosome ubiquitination and ribosome-associated quality control determine whether nutrient or translational stress is resolved or converted into ZAKα-driven cell death?","gap":"Ribosomes act as stress-signaling hubs, but the machinery that decides whether stalled/collided ribosomes are productively resolved or escalate into ribotoxic signaling and cell death was incompletely understood.","find":"HOIL-1 promotes ribosome ubiquitination and cytoprotective ribosome-associated quality control. Loss or disease-associated truncation of HOIL-1 increased sensitivity to nutrient and translational stress, increased unresolved ribosome stress, and allowed glucose starvation to activate ZAKα-dependent ATF4 signaling and disulfidptosis. The work connects the ribosome ubiquitin landscape directly to cell-fate decisions.","use":["RPS10 and RPS20 ubiquitination are useful biochemical readouts of ribosome quality-control engagement, complementing collision or polysome assays.","ZAKα knockdown/inhibition and downstream p38/ATF4 measurements provide causal controls for ribotoxic-stress signaling rather than relying on translation inhibition alone.","Anisomycin and nutrient-starvation conditions provide mechanistically distinct stress controls, while RNase-digested polysome profiles help assess collided/stalled ribosome states.","PABPC1, MKRN1, ZNF598 and HOIL-1 give a broader RQC panel for asking why two translation-inhibiting drugs can have very different survival outcomes."],"idea":"For one SG-inducing drug with strong later toxicity and one SG-inducing drug with little toxicity, compare early RPS10/RPS20 ubiquitination, p-p38/ATF4 and RNase-resistant collided-ribosome signal at matched translation inhibition. This could test whether the cell-death difference tracks unresolved RQC/ZAKα signaling rather than SG abundance itself."},
{"id":"pmid-42636110","date":"2026-08-31","journal":"Cell Reports · 2026","title":"Zinc increases stress granule formation by promoting RNA condensation","score":"10/10","topics":["stress-granules","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/42636110/","q":"Can changes in intracellular zinc directly alter stress-granule condensation independently of the degree of translation repression?","gap":"Stress granules assemble when untranslated mRNAs and G3BP proteins condense, but it has been unclear how the intracellular ionic environment tunes that condensation step separately from upstream translation arrest.","find":"The authors show that oxidative stress increases labile intracellular zinc and metallothionein expression. Raising intracellular zinc increases SG formation and delays SG disassembly without increasing translational repression, whereas zinc depletion reduces SG formation. In vitro, zinc directly promotes RNA condensation at concentrations roughly two orders of magnitude lower than magnesium, supporting a direct physicochemical effect on RNA interactions.","use":["This is a strong warning that SG abundance is not a one-to-one proxy for translation inhibition; two drug conditions with similar protein-synthesis suppression can produce different SG phenotypes because the condensation environment differs.","Useful controls include zinc addition versus zinc chelation, measurements of labile zinc, metallothionein expression, SG assembly and disassembly kinetics, and a translation readout in parallel.","For imaging, quantify not only SG-positive-cell percentage but also SG number, area, intensity and disassembly after washout.","Conceptually, this supports testing non-canonical SG-inducing drugs for changes in ionic or metabolic conditions that may directly favor RNA-ribosome condensation."],"idea":"For one drug that gives disproportionately strong SG formation relative to puromycin-based translation inhibition, repeat the treatment with a zinc chelator and quantify G3BP1 SG-positive percentage, SG area and global translation. If chelation reduces SGs without restoring translation, that would separate the condensation step from translation arrest."},
{"id":"pmid-42580851","date":"2026-08-31","journal":"Genes & Development · 2026","title":"rRNA 5'ETS processing contributes to nucleolar organization and nuclear architecture","score":"9.7/10","topics":["ribosome","ribosome-biogenesis"],"url":"https://pubmed.ncbi.nlm.nih.gov/42580851/","q":"Does progression of pre-rRNA processing itself help maintain nucleolar structure, independently of simply initiating rRNA transcription?","gap":"rRNA transcription is known to nucleate the nucleolus, but whether downstream processing reactions actively maintain its multilayered organization and material properties was much less clear.","find":"Disrupting endonucleolytic cleavage of the 5' external transcribed spacer, an early SSU-processome step, caused major changes in nucleolar morphology and organization, reduced dynamic exchange, altered the NPM1-associated interactome and redistributed heterochromatin markers. The work therefore links a specific ribosome-biogenesis reaction to the physical organization of the nucleolus and broader nuclear architecture.","use":["NPM1 morphology can report more than generic nucleolar stress: it may reflect where pre-rRNA maturation is blocked.","Useful readouts include NPM1 imaging, pre-rRNA processing intermediates, nucleolar dynamics and heterochromatin markers.","For drug screening, pairing B23/NPM1 IF with a pre-rRNA processing assay could distinguish transcriptional inhibition from processing defects.","This provides a mechanistic framework for interpreting compounds that change nucleolar shape or NPM1 distribution without simply shutting down rRNA transcription."],"idea":"For one drug that strongly changes B23/NPM1 morphology, measure an early pre-rRNA processing intermediate spanning the 5'ETS cleavage region together with NPM1 IF. Compare it with a Pol I transcription inhibitor control. A processing-specific accumulation with a distinct NPM1 phenotype would suggest the drug perturbs ribosome biogenesis downstream of transcription."},
{"id":"pmid-41419572","date":"2026-08-30","journal":"Nature Cell Biology · 2026","title":"The G3BP stress-granule proteins reinforce the integrated stress response translation programme","score":"10/10","topics":["stress-granules","translation","ribosome"],"url":"https://pubmed.ncbi.nlm.nih.gov/41419572/","q":"Do G3BP1/2 and stress granules merely accompany stress-induced translation shutdown, or do they actively shape which mRNAs continue to be translated during the integrated stress response?","gap":"SGs are tightly associated with translation repression, but previous bulk assays could not cleanly distinguish the direct contribution of G3BPs/SGs from the broader ISR, nor determine whether SG-enriched mRNAs receive a selective translational advantage.","find":"Using rapid G3BP1/2 depletion, optogenetic G3BP condensates, stress-dependent optogranules, SG purification and spike-normalized ribosome profiling, the authors show that G3BPs/SGs modestly strengthen global translation suppression while preferentially supporting translation of stress-resistant, SG-enriched mRNAs. Condensation alone was insufficient to reproduce the ISR-specific programme: the stress context was required for appropriate mRNA recruitment and translation prioritization.","use":["This changes the interpretation of SGs from passive storage sites to active modifiers of the stress translation programme.","Strong experimental tools include G3BP1/2 depletion, PABPC1 as an orthogonal SG marker, arsenite and heat-shock controls, optogenetic granule induction and spike-normalized ribosome profiling.","For drug-induced SGs, SG abundance alone may not indicate function; comparing which RNAs/proteins partition into canonical versus non-canonical SGs could be more informative.","The distinction between stress-dependent SGs and artificial G3BP condensates is a useful control when arguing that a phenotype is caused by SG function rather than G3BP condensation itself."],"idea":"Compare a canonical arsenite SG condition with one ribosome-enriched drug-induced SG condition. Quantify G3BP1, PABPC1 and selected stress-response mRNAs by RNA-FISH inside SGs, while measuring global translation by puromycin incorporation. If the drug SGs recruit a different RNA set despite similar G3BP morphology, that would support a functionally distinct SG state."},
{"id":"pmid-40952561","date":"2026-08-29","journal":"Molecular and Cellular Biochemistry · 2026","title":"The many ways to inhibit translation by Sorafenib in liver cancer cells","score":"9.6/10","topics":["translation","ribosome","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/40952561/","q":"Which translation-control pathways are responsible for the rapid inhibition of protein synthesis caused by the anticancer drug sorafenib?","gap":"Sorafenib was known to inhibit translation in hepatocellular carcinoma cells, but the relative contributions of the ISR, eIF4E/MNK signaling, eIF4F assembly and mTORC1 were not well separated.","find":"Sorafenib rapidly and progressively reduced global translation and polysomes through PERK/eIF2α, ERK-MNK-eIF4E, eIF4F and mTORC1-linked signaling changes.","use":["A pathway-dissection template for anticancer translation inhibitors.","Reusable readouts: puromycin incorporation, p-eIF2α, p-4EBP1, p-RPS6, p-eIF4E, p-ERK1/2 and polysome profiling.","Distinguish ISR-dependent initiation inhibition from mTOR/eIF4F-dependent inhibition."],"idea":"Profile these pathway markers at 0.5, 1 and 4 h in SG-positive and SG-negative translation inhibitors."},
{"id":"pmid-42438948","date":"2026-08-29","journal":"Autophagy · 2026","title":"Genome-wide CRISPR-Cas9-based screening revealed the role of ubiquitin ligase TRIM25 in ribosome degradation via ribophagy","score":"9.0/10","topics":["ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/42438948/","q":"Which factors control selective degradation of ribosomes by ribophagy?","gap":"The upstream machinery recognizing mammalian ribosomes for degradation remained incomplete.","find":"A genome-wide CRISPR screen using an RPL29-mCherry-GFP reporter identified TRIM25 as a ribophagy regulator linked to ribosome ubiquitination and stress-induced turnover.","use":["Extends ribosome stress beyond collision resolution to selective ribosome degradation.","The tandem RPL29-mCherry-GFP reporter is useful for imaging ribosome delivery to lysosomes.","TRIM25, LC3 and ribosomal-protein abundance are possible follow-up readouts."],"idea":"At late drug time points, test whether falling ribosomal signal reflects autophagic turnover rather than redistribution."},
{"id":"pmid-41656003","date":"2026-08-28","journal":"RNA · 2026","title":"Tuning tRNA synthetase inhibition reveals parabolic induction of stress granules limited in size and RNA content","score":"10/10","topics":["stress-granules","ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41656003/","q":"How does partial translation elongation inhibition determine whether SGs form?","gap":"It was unclear why SG induction is not proportional to elongation stress intensity.","find":"Intermediate tRNA-synthetase inhibition activates GCN2/ISR and SGs, whereas stronger ribosome occupancy limits SG number, size and RNA content; puromycin links ribosome release to SG assembly.","use":["Explains non-monotonic SG dose responses.","Reusable tools include U2OS GFP-G3BP1, p-eIF2α, puromycin rescue, GCN2 inhibition, oligo(dT) FISH and partition coefficients.","Quantify SG-positive cells, number, area and composition."],"idea":"Repeat a multi-dose series for a non-linear SG-inducing drug with puromycin incorporation and p-eIF2α in parallel."},
{"id":"pmid-41421357","date":"2026-08-28","journal":"Cell · 2026","title":"Nuclear speckle proteins form intrinsic and MALAT1-dependent microphases","score":"9.3/10","topics":["nuclear-speckles"],"url":"https://pubmed.ncbi.nlm.nih.gov/41421357/","q":"What physical principles organize nuclear speckles and how does MALAT1 influence them?","gap":"The nanoscale organization and MALAT1 contribution were unresolved.","find":"SRSF proteins and TDP-43 form ordered microphases; MALAT1 selectively stabilizes or destabilizes distinct assemblies.","use":["Morphology may reflect internal microphase reorganization.","Useful markers include SRSF1, SON and MALAT1 RNA-FISH.","Quantify number, area, intensity heterogeneity and RNA partitioning."],"idea":"Pair SON/SRSF1 IF with MALAT1 RNA-FISH after a speckle-altering drug."},
{"id":"pmid-41583565","date":"2026-08-27","journal":"iScience · 2026","title":"Chronic stress antagonizes formation of stress granules","score":"9.8/10","topics":["stress-granules","ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/41583565/","q":"How does chronic low-level stress alter later SG competence?","gap":"Prolonged stress responses may differ fundamentally from acute stress.","find":"Chronic stress can strongly inhibit protein synthesis while preserving ribosome occupancy and reducing later SG assembly, with eEF2 phosphorylation and elongation slowing implicated.","use":["Useful when translation inhibition and SG abundance disagree.","Measure phospho-eEF2, puromycin incorporation and SG competence across exposure times.","Separate persistent stalls from canonical collision states."],"idea":"Compare acute versus prolonged drug exposure followed by arsenite challenge."},
{"id":"pmid-41535071","date":"2026-08-27","journal":"Genes & Development · 2026","title":"tRNA synthetase activity is required for stress granule and P-body assembly","score":"10/10","topics":["stress-granules","ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/41535071/","q":"Why can strong ISR activation occur without SG or P-body assembly?","gap":"p-eIF2α and initiation suppression alone do not explain all SG-negative states.","find":"tRNA-synthetase inhibition creates persistent ribosome stalls that keep mRNAs ribosome-bound and suppress SG/P-body formation; puromycin release can restore granules.","use":["A mechanistic model for p-eIF2α-positive but SG-negative drugs.","Useful tools include ZNF598, eS10 ubiquitination, polysome/disome analysis and puromycin rescue.","Halofuginone, arsenite and thapsigargin form a strong control set."],"idea":"Use short puromycin release to test whether a p-eIF2α-positive SG-negative drug is limited by ribosome occupancy."},
{"id":"pmid-42214329","date":"2026-08-26","journal":"Molecular Cell · 2026","title":"Mechanism of RACK1-dependent ZAKα activation at stalled and collided ribosomes","score":"9.7/10","topics":["ribosome","translation"],"url":"https://pubmed.ncbi.nlm.nih.gov/42214329/","q":"How does ZAKα recognize impaired ribosome processivity?","gap":"It was unclear whether ZAKα is strictly a collision sensor.","find":"ZAKα contacts RACK1, RPS27, 18S rRNA and emerging mRNA; prolonged binding permits activation and collisions strengthen but are not essential for signaling.","use":["Do not equate ZAK activation exclusively with collisions.","Useful readouts include ZAKα and phospho-p38/JNK.","Compare processivity defects with global translation loss."],"idea":"Compare ZAK/p38 activation across drugs with matched translation inhibition but different SG phenotypes."},
{"id":"pmid-41912913","date":"2026-08-26","journal":"Leukemia · 2026","title":"BCR::ABL1 tyrosine kinase inhibitors induce ribosome collisions to activate ZAK-dependent ribotoxic stress and apoptosis in chronic myeloid leukemia","score":"9.5/10","topics":["ribosome","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41912913/","q":"Can targeted anticancer therapy kill cells through ribosome collisions and ribotoxic stress?","gap":"The therapeutic contribution of collision-driven ZAK signaling was unclear.","find":"BCR::ABL1 inhibition increased EEF2 phosphorylation, slowed elongation, generated collided ribosomes and activated ZAK-p38-dependent apoptosis.","use":["Separate initiation inhibition from elongation slowing.","Useful readouts include p-EEF2, ZAK/p38, nuclease-resistant ribosomes and apoptosis.","Modulating translation flux gives causal controls."],"idea":"Test whether early p-EEF2 and p-p38 predict later death better than SG abundance."},
{"id":"pmid-41747727","date":"2026-08-25","journal":"Cell · 2026","title":"Nuclear speckles enable processing of RNA from GC-rich isochores","score":"9.2/10","topics":["nuclear-speckles"],"url":"https://pubmed.ncbi.nlm.nih.gov/41747727/","q":"Which transcripts functionally depend on nuclear speckles?","gap":"Direct functional requirements of speckles in RNA processing were difficult to isolate.","find":"Acute SON/SRRM2 removal disrupted speckles and selectively impaired processing of GC-rich genes with exon skipping and intron retention.","use":["SON and SRRM2 are strong structural markers.","Combine IF with RNA-processing readouts.","RNA-FISH and splicing analysis separate morphology from function."],"idea":"Pair drug-induced SON/SRRM2 morphology changes with a defined RNA-processing readout."},
{"id":"pmid-41551405","date":"2026-08-25","journal":"NAR Cancer · 2026","title":"Ribosome biogenesis is increased in hepatocellular carcinoma and represents a potential therapeutic target","score":"8.8/10","topics":["ribosome","ribosome-biogenesis","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/41551405/","q":"Does increased ribosome biogenesis create a therapeutic vulnerability in cancer?","gap":"Which nucleolar features predict sensitivity remained unclear.","find":"HCC showed increased Treacle, UBF, Fibrillarin and rRNA production and enhanced sensitivity to nucleolar-targeting compounds.","use":["Useful markers: TCOF1/Treacle, UBF and Fibrillarin.","Quantify nucleolar intensity, number, size and total area.","Compare tumour and normal-cell selectivity."],"idea":"Add Fibrillarin or UBF to NPM1 imaging and correlate nucleolar disruption with SG induction and translation inhibition."},
{"id":"pmid-42524886","date":"2026-08-24","journal":"Journal of Cell Biology · 2026","title":"PARP1 hyperactivity stalls translation and triggers stress granule formation following DNA damage","score":"9.8/10","topics":["stress-granules","translation","drug"],"url":"https://pubmed.ncbi.nlm.nih.gov/42524886/","q":"How does DNA damage communicate with cytoplasmic translation to trigger SGs?","gap":"The pathway linking nuclear damage to translation arrest was unclear.","find":"PARP1 hyperactivity depletes NAD+/ATP, activates AMPK, suppresses mTORC1/4EBP1, inhibits translation and promotes SG assembly; G3BP1/2-deficient cells are less viable after genotoxic stress.","use":["Measure p-eIF2α together with mTORC1/4EBP1.","Use SG-defective cells to test causality for survival.","Metabolic rescue can establish pathway order."],"idea":"Combine live SG-onset/death tracking with p-eIF2α and 4EBP1 measurements at matched time points."},
{"id":"pmid-41042876","date":"2026-08-23","journal":"Science Advances · 2025","title":"Translation landscape of stress granules","score":"10/10","topics":["stress-granules","ribosome","translation","cryo-clem"],"url":"https://pubmed.ncbi.nlm.nih.gov/41042876/","q":"Which ribosomal and translation-related complexes are present inside stress granules in intact cells?","gap":"Fluorescence enrichment cannot reveal structural states of ribosomes inside SGs.","find":"Cryogenic correlative imaging and electron tomography directly examined translation-related complexes in SG regions and supported selective partitioning rather than indiscriminate ribosome sequestration.","use":["A direct methodological reference for SG cryo-CLEM/cryo-ET.","Compare SG regions with nearby cytoplasm under the same condition.","Distinguish fluorescence from 40S, 60S and 80S structural states."],"idea":"Use IF to select a drug with strong RPL7 enrichment, compare 40S and 60S markers against arsenite, then prioritize it for cryo-ET."}
];
const KEY='phdDailyPaperFlagsV2';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let view='today',topic='all';
function flags(id){return state[id]||{read:false,pub:false}}function setFlag(id,k,v){state[id]={...flags(id),[k]:v};localStorage.setItem(KEY,JSON.stringify(state));render()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const latest=[...PAPERS].map(p=>p.date).sort().reverse()[0];let ps=PAPERS.filter(p=>topic==='all'||p.topics.includes(topic));if(view==='today')ps=ps.filter(p=>p.date===latest);if(view==='archive')ps=ps.filter(p=>p.date!==latest);if(view==='publication')ps=ps.filter(p=>flags(p.id).pub);if(view==='unread')ps=ps.filter(p=>!flags(p.id).read);ps.sort((a,b)=>b.date.localeCompare(a.date));const root=document.getElementById('paperRoot');if(!ps.length){root.innerHTML='<div class="empty">No papers in this view yet.</div>';return}const by={};ps.forEach(p=>(by[p.date]??=[]).push(p));root.innerHTML=Object.keys(by).sort().reverse().map(d=>`<section class="day"><h2>${new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2>${by[d].map(card).join('')}</section>`).join('');root.querySelectorAll('[data-read]').forEach(x=>x.onchange=e=>setFlag(x.dataset.read,'read',e.target.checked));root.querySelectorAll('[data-pub]').forEach(x=>x.onchange=e=>setFlag(x.dataset.pub,'pub',e.target.checked))}
function card(p){const f=flags(p.id);return `<article class="paper ${f.pub?'saved':''}" data-paper-id="${p.id}" data-date="${p.date}" data-topics="${p.topics.join(' ')}"><div class="meta">${esc(p.journal)}</div><h3>${esc(p.title)}</h3><span class="score">Relevance: ${p.score}</span><div class="actions"><label><input type="checkbox" data-read="${p.id}" ${f.read?'checked':''}> ✓ Read</label><label><input type="checkbox" data-pub="${p.id}" ${f.pub?'checked':''}> ⭐ Useful for publication</label></div><div class="section"><b>Main research question</b><p>${esc(p.q)}</p></div><div class="section"><b>Problem / knowledge gap</b><p>${esc(p.gap)}</p></div><div class="section"><b>Key findings</b><p>${esc(p.find)}</p></div><div class="section"><b>What you can learn / use</b><ul>${p.use.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><b>Experiment idea</b><p>${esc(p.idea)}</p></div><a href="${p.url}" target="_blank" rel="noreferrer">Open primary paper →</a><div class="tags">${p.topics.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div></article>`}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-topic]').forEach(x=>x.classList.remove('active'));b.classList.add('active');topic=b.dataset.topic;render()});todayLabel.textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});render();
</script></body></html>
